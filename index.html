   {t:{pt:'Contexto',en:'Context',fr:'Contexte',zh:"情境"},g:'1',p:[{pt:'5 de 6 grupos montaram um método próprio antes de abrir a IA: brainstorm de palavras, 9 fatias da semana, prompt autoral.',en:'5 of 6 groups built their own method before opening AI: word brainstorm, 9 slices of the week, an authored prompt.',fr:'5 groupes sur 6 ont monté leur propre méthode avant d’ouvrir l’IA : brainstorm de mots, 9 tranches de la semaine, prompt d’auteur.',zh:"6 个小组中有 5 个在打开人工智能之前先建立了自己的方法：词语头脑风暴、把一周分成 9 份、自己撰写提示词。"},{pt:'ChatGPT foi a porta de entrada (5 grupos); 4 grupos cruzaram mais de uma IA.',en:'ChatGPT was the entry point (5 groups); 4 groups crossed more than one AI.',fr:'ChatGPT a été la porte d’entrée (5 groupes) ; 4 groupes ont croisé plusieurs IA.',zh:"ChatGPT 是入口（5 个小组）；4 个小组交叉使用了多个人工智能。"}],
    f:[{pt:'A IA devolveu soluções “quase prontas” cedo demais; dois grupos recuaram para entender o contexto.',en:'AI returned “almost finished” solutions too early; two groups stepped back to understand the context.',fr:'L’IA a rendu des solutions « presque finies » trop tôt ; deux groupes sont revenus comprendre le contexte.',zh:"人工智能过早给出了“几乎完成”的方案；两个小组退回一步去理解情境。"},{pt:'Comparar com Times Square e Champs-Élysées revelou a falta de grandes eventos globais, como Carnaval e Réveillon.',en:'Comparing with Times Square and the Champs-Élysées revealed the lack of global-scale events such as Carnival and New Year.',fr:'La comparaison avec Times Square et les Champs-Élysées a révélé l’absence d’événements mondiaux comme le Carnaval ou le Nouvel An.',zh:"与时代广场和香榭丽舍大道比较，暴露出缺少狂欢节和跨年这类全球规模的活动。"}],
    d:[{pt:'Excesso de informação e restrições em 2,7 km de avenida.',en:'Too much information and constraints along 2.7 km of avenue.',fr:'Trop d’informations et de contraintes sur 2,7 km d’avenue.',zh:"在 2.7 公里长的大道上，信息和限制条件太多。"},{pt:'Respostas técnicas, difíceis de digerir; decidir o que priorizar.',en:'Technical answers, hard to digest; deciding what to prioritise.',fr:'Réponses techniques, difficiles à digérer ; décider quoi prioriser.',zh:"技术性的回答不易消化；要决定优先处理什么。"}]},
   {t:{pt:'Insights',en:'Insights',fr:'Insights',zh:"洞察"},g:'2',p:[{pt:'O leque de IAs cresceu: 10 ferramentas, com NotebookLM como ponto de síntese e Elicit como fonte acadêmica.',en:'The range of AIs grew: 10 tools, with NotebookLM as synthesis point and Elicit as academic source.',fr:'L’éventail d’IA s’est élargi : 10 outils, NotebookLM comme point de synthèse et Elicit comme source académique.',zh:"人工智能的范围扩大了：共 10 种工具，以 NotebookLM 作为综合节点，以 Elicit 作为学术来源。"},{pt:'Em vários grupos os insights nasceram das percepções do próprio grupo; a IA foi usada para validar e reformular.',en:'In several groups the insights came from the group’s own perceptions; AI was used to validate and reformulate.',fr:'Dans plusieurs groupes, les insights sont nés des perceptions du groupe ; l’IA a servi à valider et reformuler.',zh:"在好几个小组里，洞察来自小组自己的感受；人工智能用来验证和重述。"}],
    f:[{pt:'A Paulista aparece como experiência do corpo: exposição, conforto e desconforto; faltam assentos, o clima pesa, o tráfego disputa a calçada.',en:'Paulista appears as a bodily experience: exposure, comfort and discomfort; few seats, heavy climate, traffic contesting the pavement.',fr:'La Paulista apparaît comme expérience du corps : exposition, confort et inconfort ; peu de sièges, climat pesant, trafic qui dispute le trottoir.',zh:"保利斯塔呈现为一种身体体验：暴晒、舒适与不适；座位很少，气候闷热，车流抢占人行道。"},{pt:'Tese e antítese geraram três abordagens distintas; um mapa mental do NotebookLM organizou contexto, identidade, usos e atores.',en:'Thesis and antithesis produced three distinct approaches; a NotebookLM mind map organised context, identity, uses and actors.',fr:'Thèse et antithèse ont produit trois approches distinctes ; une carte mentale NotebookLM a organisé contexte, identité, usages et acteurs.',zh:"正题与反题产生了三种不同的路径；一张 NotebookLM 思维导图整理了情境、身份、用途与参与者。"}],
    d:[{pt:'Separar o que é descritivo do que é insight.',en:'Telling what is descriptive from what is an insight.',fr:'Distinguer ce qui est descriptif de ce qui est insight.',zh:"分清什么是描述，什么是洞察。"},{pt:'IAs que saltavam direto para o mobiliário; reorganizar várias vozes sem perder o fio.',en:'AIs jumping straight to furniture; reorganising several voices without losing the thread.',fr:'IA sautant directement au mobilier ; réorganiser plusieurs voix sans perdre le fil.',zh:"人工智能直接跳到家具；在不丢线索的前提下重新整理多种声音。"}]},
   {t:{pt:'Ideação',en:'Ideation',fr:'Idéation',zh:"构思"},g:'3',p:[{pt:'Um grupo documentou 16 prompts: 6 mantidos como princípio, 5 revisados, 2 rejeitados, 2 selecionados e 1 final.',en:'One group documented 16 prompts: 6 kept as principle, 5 revised, 2 rejected, 2 selected and 1 final.',fr:'Un groupe a documenté 16 prompts : 6 gardés comme principe, 5 révisés, 2 rejetés, 2 retenus et 1 final.',zh:"一个小组记录了 16 条提示词：6 条保留为原则，5 条修改，2 条否决，2 条选定，1 条最终。"},{pt:'No Tema B, imagem e vídeo viram matéria poética: storyboards de fachadas de luz, renders noturnos. Um grupo declara a cadeia inteira (ideação em conversa, exploração visual, Figma e Claude no protótipo, vídeo de cenário).',en:'In Theme B, image and video become poetic material: light-façade storyboards, night renders. One group declares its whole chain (ideation by conversation, visual exploration, Figma and Claude for the prototype, scenario video).',fr:'Au Thème B, image et vidéo deviennent matière poétique : storyboards de façades lumineuses, rendus nocturnes. Un groupe déclare toute sa chaîne (idéation par conversation, exploration visuelle, Figma et Claude pour le prototype, vidéo de scénario).',zh:"在主题 B 中，图像和视频成为诗意的材料：光立面的分镜、夜景渲染。一个小组公开了完整的工作链（对话式构思、视觉探索、用 Figma 和 Claude 做原型、情景视频）。"}],
    f:[{pt:'Rejeitar também é projetar: ideias “brincalhonas demais” ou “específicas demais” saíram, e o princípio de flexibilidade ficou. Outro grupo descartou a primeira onda (“a média”: hologramas, drones, skyline futurista) porque a máquina respondia com o futuro que já conhecíamos.',en:'Rejecting is also designing: ideas “too playful” or “too specific” were dropped while the flexibility principle stayed. Another group dropped the first wave (“the average”: holograms, drones, futuristic skyline) because the machine answered with the future we already knew.',fr:'Rejeter, c’est aussi concevoir : les idées « trop ludiques » ou « trop spécifiques » sont tombées, le principe de flexibilité est resté. Un autre groupe a écarté la première vague (« la moyenne » : hologrammes, drones, skyline futuriste) car la machine répondait avec le futur déjà connu.',zh:"舍弃也是设计：“太好玩”或“太具体”的想法被舍弃，灵活性原则被保留。另一个小组舍弃了第一轮（“平均值”：全息影像、无人机、未来感天际线），因为机器给出的是我们早已知道的未来。"}],
    d:[{pt:'Saber quem estava dando as ideias e os conceitos visuais, e quem influenciava quem: o grupo ou a IA.',en:'Knowing who was giving the ideas and the visual concepts, and who was influencing whom: the group or the AI.',fr:'Savoir qui apportait les idées et les concepts visuels, et qui influençait qui : le groupe ou l’IA.',zh:"弄不清是谁在提出想法和视觉概念，谁在影响谁：是小组，还是人工智能。"}]},
   {t:{pt:'Soluções',en:'Solutions',fr:'Solutions',zh:"方案"},g:'4',p:[{pt:'Doze ensaios chegaram à banca com pôster, imagens e modelos: maquetes de sistemas flexíveis, protótipos de app, renders e vídeos.',en:'Twelve essays reached the review with poster, images and models: flexible-system mock-ups, app prototypes, renders and videos.',fr:'Douze essais sont arrivés au jury avec affiche, images et maquettes : systèmes flexibles, prototypes d’appli, rendus et vidéos.',zh:"十二个作品带着海报、图像和模型来到评审：灵活系统的模型、应用原型、渲染图和视频。"}],
    f:[{pt:'De objeto a “condições”: o mobiliário vira infraestrutura pública; a comunicação vira avenida que responde; o serviço vira cultura como infraestrutura.',en:'From object to “conditions”: furniture becomes public infrastructure; communication becomes an avenue that answers; service becomes culture as infrastructure.',fr:'De l’objet aux « conditions » : le mobilier devient infrastructure publique ; la communication, une avenue qui répond ; le service, la culture comme infrastructure.',zh:"从物件到“条件”：家具变成公共基础设施；传播变成会回应的大道；服务变成作为基础设施的文化。"},{pt:'Cada ordem de design tendeu a uma cor: terra e dourado (com cinza) no A, azul e violeta no B e vermelho no C.',en:'Each order of design leaned to a colour: earth and gold (with grey) in A, blue and violet in B and red in C.',fr:'Chaque ordre de design a tendu vers une couleur : terre et doré (avec du gris) au A, bleu et violet au B et rouge au C.',zh:"每个设计层级都倾向一种颜色：A 为泥土与金色（带灰色），B 为蓝与紫，C 为红。"}],
    d:[{pt:'Entender de onde (a fonte) vinham as referências.',en:'Understanding where (the source) the references came from.',fr:'Comprendre d’où (la source) venaient les références.',zh:"弄清楚参考资料来自哪里（出处）。"},{pt:'Ter clareza sobre os custos socioambientais da IA no processo.',en:'Having clarity on the socio-environmental costs of AI in the process.',fr:'Avoir de la clarté sur les coûts socio-environnementaux de l’IA dans le processus.',zh:"弄清楚人工智能在这一过程中的社会与环境成本。"},{pt:'Os limites das versões gratuitas, que uma IA paga e com mais tokens poderia ter superado.',en:'The limits of free versions, which a paid AI with more tokens could have overcome.',fr:'Les limites des versions gratuites, qu’une IA payante avec plus de tokens aurait pu dépasser.',zh:"免费版本的限制，是付费、额度更多的人工智能本可以突破的。"}]}],
  rq_h:{pt:'Respostas às três perguntas orientadoras',en:'Answers to the three guiding questions',fr:'Réponses aux trois questions directrices',zh:"对三个指导问题的回答"},
  rq_note:{pt:'Respostas parciais: apoiadas nos 6 diários da tarde (aulas 1–2) e nos artefatos. A turma da manhã e as aulas 3–4 podem confirmá-las ou ajustá-las.',en:'Partial answers: based on the six afternoon logbooks (classes 1–2) and the artefacts. The morning class and classes 3–4 may confirm or adjust them.',fr:'Réponses partielles : fondées sur les six journaux de l’après-midi (cours 1–2) et les artefacts. La classe du matin et les cours 3–4 pourront les confirmer ou les ajuster.',zh:"部分回答：依据下午六个小组的日志（第 1–2 次课）和成果物。上午班和第 3–4 次课可能会印证或调整这些回答。"},
  rqa:[
   {n:'P1',h:{pt:'Agência',en:'Agency',fr:'Agentivité',zh:"创作主导权"},q:{pt:'O designer continua autor das decisões?',en:'Does the designer remain the author of decisions?',fr:'Le designer reste-t-il auteur des décisions ?',zh:"设计师仍是决策的作者吗？"},t:{pt:'Sim, mas por protocolo, não por acaso. Os grupos que mantiveram a autoria criaram um ritual humano antes da máquina e usaram a IA como segunda opinião. A autonomia declarada ficou entre 3 e 4,5 em 5. A agência distribuída aparece em outro lugar: na escolha de qual voz de IA ouvir. O risco é a IA apenas confirmar o que o grupo já pensava.',en:'Yes, but by protocol, not by chance. Groups that kept authorship created a human ritual before the machine and used AI as a second opinion. Declared autonomy sat between 3 and 4.5 out of 5. Distributed agency shows up elsewhere: in choosing which AI voice to listen to. The risk is AI merely confirming what the group already thought.',fr:'Oui, mais par protocole, pas par hasard. Les groupes qui ont gardé l’autorité créative ont créé un rituel humain avant la machine et utilisé l’IA comme second avis. L’autonomie déclarée s’est située entre 3 et 4,5 sur 5. L’agentivité distribuée apparaît ailleurs : dans le choix de la voix d’IA à écouter. Le risque : l’IA ne fait que confirmer ce que le groupe pensait déjà.',zh:"是的，但靠的是流程，而不是偶然。保住创作权的小组，在机器之前先建立了一套由人完成的程序，并把人工智能当作第二意见。声明的自主度在 5 分中处于 3 到 4.5 之间。分散的主导权出现在别处：选择听取哪一个人工智能的声音。风险在于人工智能只是印证了小组原本的想法。"},lv:{pt:'Evidência: forte (6 grupos)',en:'Evidence: strong (6 groups)',fr:'Preuve : forte (6 groupes)',zh:"证据：充分（6 个小组）"}},
   {n:'P2',h:{pt:'Repertório',en:'Repertoire',fr:'Répertoire',zh:"设计积累"},q:{pt:'A IA acelera o julgamento ou o substitui?',en:'Does AI speed up judgement or replace it?',fr:'L’IA accélère-t-elle le jugement ou le remplace-t-elle ?',zh:"人工智能是加速判断，还是取代判断？"},t:{pt:'Os sinais apontam para aceleração, com ressalva. Os alunos descartaram respostas técnicas demais, enviesadas ou prematuras, reescreveram perguntas e compararam IAs: isso é critério em formação. Mas a nota 4,5 de um grupo que pediu “muitos insights” para escolher depois mostra o outro caminho. Só o acompanhamento das aulas 3–4 mostrará se o critério se sustenta na produção.',en:'Signs point to acceleration, with a caveat. Students dropped answers that were too technical, biased or premature, rewrote questions and compared AIs: that is judgement forming. But one group’s 4.5 for asking for “lots of insights” to choose from later shows the other path. Only following classes 3–4 will show whether the judgement holds in production.',fr:'Les signes indiquent une accélération, avec une réserve. Les étudiants ont écarté des réponses trop techniques, biaisées ou prématurées, réécrit des questions et comparé des IA : c’est du jugement en formation. Mais le 4,5 d’un groupe demandant « beaucoup d’insights » pour choisir ensuite montre l’autre voie. Seuls les cours 3–4 diront si le jugement tient en production.',zh:"迹象指向加速，但有保留。学生舍弃了过于技术化、有偏见或为时过早的回答，改写问题并比较不同的人工智能：这是判断力在形成。但有一个小组为“要很多洞察”以便日后挑选而给出 4.5 分，显示出另一条路。只有跟踪第 3–4 次课，才能知道这种判断在制作中是否站得住。"},lv:{pt:'Evidência: moderada',en:'Evidence: moderate',fr:'Preuve : modérée',zh:"证据：中等"}},
   {n:'P3',h:{pt:'Fronteira',en:'Frontier',fr:'Frontière',zh:"边界"},q:{pt:'O efeito é uniforme entre as ordens?',en:'Is the effect uniform across orders?',fr:'L’effet est-il uniforme entre les ordres ?',zh:"这种影响在各层级是一致的吗？"},t:{pt:'Não. No Tema A (objetos) a IA fecha forma rápido, e o trabalho foi reabrir o problema. No B (símbolos e interações) a IA virou matéria estética e abriu o leque de ferramentas: 10 IAs. No C (sistemas) serviu mais a ler e sintetizar, com hipóteses marcadas “a testar”. A estética acompanha (leitura editorial, ver Estética): a cor varia por ordem (terra, dourado e cinza no A; azul e violeta no B; vermelho no C); a tipografia é de grotesca condensada no A e no C, com serifa e grotesca em contraste no B; e a forma vai do módulo e da casca orgânica no A às camadas no B e às camadas e linhas de fluxo no C.',en:'No. In Theme A (objects) AI closes form quickly, and the work was reopening the problem. In B (symbols & interactions) AI became aesthetic material and widened the toolset: 10 AIs. In C (systems) it served mostly to read and synthesise, with hypotheses marked “to be tested”. The aesthetics follow (editorial reading, see Aesthetics): colour varies by order (earth, gold and grey in A; blue and violet in B; red in C); typography is condensed grotesque in A and C, with serif and grotesque in contrast in B; and form goes from the module and the organic shell in A to layers in B and to layers and lines of flow in C.',fr:'Non. Au Thème A (objets), l’IA ferme vite la forme et le travail a été de rouvrir le problème. Au B (symboles et interactions), l’IA est devenue matière esthétique et a élargi l’outillage : 10 IA. Au C (systèmes), elle a surtout servi à lire et synthétiser, avec des hypothèses « à éprouver ». L’esthétique suit (lecture éditoriale, voir Esthétique) : la couleur varie selon l’ordre (terre, doré et gris au A ; bleu et violet au B ; rouge au C) ; la typographie est une grotesque condensée au A et au C, avec empattement et grotesque en contraste au B ; et la forme va du module et de la coque organique au A aux couches au B et aux couches et lignes de flux au C.',zh:"不一致。在主题 A（物件）里，人工智能很快就把形态定死，工作在于重新打开问题。在 B（符号与互动）里，人工智能成为审美材料，并扩大了工具范围：10 种人工智能。在 C（系统）里，它主要用于阅读与综合，假设都标明“有待检验”。美学也随之而变（编辑性解读，见“美学”）：色彩随层级而异（A 为泥土、金色与灰色；B 为蓝与紫；C 为红）；字体在 A 和 C 是窄体无衬线，B 则是衬线与无衬线的对比；形态从 A 的模块和有机的壳，到 B 的层叠，再到 C 的层叠与流动线条。"},lv:{pt:'Evidência: indicativa',en:'Evidence: indicative',fr:'Preuve : indicative',zh:"证据：初步"}}],
  learn_h:{pt:'O que vale aprender para a educação em IA de designers',en:'What is worth learning for AI education of designers',fr:'Ce qu’il faut retenir pour l’éducation des designers à l’IA',zh:"培养设计师使用人工智能，值得学到什么"},
  learn:[
   {h:{pt:'Ensinar a ordem das operações',en:'Teach the order of operations',fr:'Enseigner l’ordre des opérations',zh:"教授操作的先后顺序"},t:{pt:'Enquadrar o problema com método próprio antes de gerar. Quem começou pela IA recebeu soluções prontas e teve de voltar atrás.',en:'Frame the problem with your own method before generating. Whoever started with AI received ready-made solutions and had to go back.',fr:'Cadrer le problème avec sa propre méthode avant de générer. Qui a commencé par l’IA a reçu des solutions toutes faites et a dû revenir.',zh:"先用自己的方法界定问题，再去生成。先从人工智能开始的人，拿到的是现成方案，不得不回头。"}},
   {h:{pt:'Treinar a diferença entre descrever e compreender',en:'Train the difference between describing and understanding',fr:'Entraîner la différence entre décrire et comprendre',zh:"训练区分“描述”与“理解”"},t:{pt:'Separar dado, descrição e insight é a habilidade que a IA mais deixa em evidência — e que mais falta ao designer iniciante.',en:'Separating data, description and insight is the skill AI most exposes — and the one novice designers lack most.',fr:'Séparer donnée, description et insight est la compétence que l’IA met le plus en évidence — et qui manque le plus au débutant.',zh:"把数据、描述和洞察区分开来，是人工智能最能暴露的能力，也是初学设计师最欠缺的。"}},
   {h:{pt:'Triangular vozes e conhecer suas origens',en:'Triangulate voices and know their origins',fr:'Trianguler les voix et connaître leurs origines',zh:"对多种声音做三角验证，并了解它们的来源"},t:{pt:'Comparar IAs de origens diferentes expõe vieses. Triangular passa a ser técnica de pesquisa, não apenas checagem.',en:'Comparing AIs from different origins exposes biases. Triangulating becomes a research technique, not merely a check.',fr:'Comparer des IA d’origines différentes expose les biais. Trianguler devient une technique de recherche, pas un simple contrôle.',zh:"比较不同来源的人工智能会暴露偏见。三角验证成为一种研究技术，而不只是核对。"}},
   {h:{pt:'Tornar a curadoria visível e avaliável',en:'Make curation visible and assessable',fr:'Rendre la curation visible et évaluable',zh:"让筛选过程可见、可评估"},t:{pt:'O registro de prompts (mantido, revisado, rejeitado) e o diário de bordo transformam autoria em evidência. “O que aqui é de vocês?” deveria virar pergunta de avaliação.',en:'The prompt record (kept, revised, rejected) and the logbook turn authorship into evidence. “What here is yours?” should become an assessment question.',fr:'Le registre de prompts (gardé, révisé, rejeté) et le journal de bord transforment l’autorité créative en preuve. « Qu’est-ce qui est à vous ici ? » devrait devenir une question d’évaluation.',zh:"提示词记录（保留、修改、否决）和日志，把创作权变成证据。“这里有什么是你们自己的？”应该成为一道评估问题。"}},
   {h:{pt:'Ensinar a IA por tipo de problema',en:'Teach AI by type of problem',fr:'Enseigner l’IA par type de problème',zh:"按问题类型教授人工智能"},t:{pt:'Objetos, símbolos e sistemas pedem usos diferentes. O curso pode propor percursos por ordem de design em vez de um tutorial único de ferramentas.',en:'Objects, symbols and systems call for different uses. A course can offer paths by order of design instead of a single tool tutorial.',fr:'Objets, symboles et systèmes appellent des usages différents. Un cours peut proposer des parcours par ordre de design plutôt qu’un tutoriel d’outils unique.',zh:"物件、符号与系统需要不同的用法。课程可以按设计层级设置路径，而不是只讲一个工具教程。"}},
   {h:{pt:'Definir um protocolo e referências para quem está começando',en:'Define a protocol and references for those who are starting',fr:'Définir un protocole et des références pour les débutants',zh:"为初学者制定流程与参考资料"},t:{pt:'Quem inicia a aprendizagem precisa de um protocolo claro de uso (o que fazer antes, durante e depois da IA) e de um conjunto de referências para apoiar as primeiras decisões.',en:'Beginners need a clear usage protocol (what to do before, during and after AI) and a set of references to support their first decisions.',fr:'Les débutants ont besoin d’un protocole d’usage clair (quoi faire avant, pendant et après l’IA) et d’un ensemble de références pour soutenir leurs premières décisions.',zh:"初学者需要清晰的使用规范（在人工智能之前、之中和之后做什么），以及一套支撑最初决定的参考资料。"}},
   {h:{pt:'Repensar os critérios de avaliação já com a IA no processo',en:'Rethink assessment criteria with AI already in the process',fr:'Repenser les critères d’évaluation avec l’IA déjà dans le processus',zh:"在人工智能已融入过程的前提下，重新思考评估标准"},t:{pt:'Educadores devem rever o que avaliam, já que a IA participa de cada etapa: processo, autoria e uso crítico passam a pesar junto com o resultado.',en:'Educators should review what they assess, since AI takes part in every stage: process, authorship and critical use weigh alongside the result.',fr:'Les enseignants doivent revoir ce qu’ils évaluent, puisque l’IA intervient à chaque étape : processus, autorité créative et usage critique pèsent autant que le résultat.',zh:"教育者应重新审视自己评估的内容，因为人工智能参与每一个阶段：过程、创作权与批判性使用，应与结果一并计入。"}},
   {h:{pt:'Estimular IAs de origens diferentes e uma IA diferente para cada etapa',en:'Encourage AIs of different origins and a different AI for each stage',fr:'Encourager des IA d’origines différentes et une IA différente à chaque étape',zh:"鼓励使用不同来源的人工智能，并在每个阶段使用不同的人工智能"},t:{pt:'Variar a localidade e o tipo de IA amplia o repertório e expõe vieses; cada etapa do processo criativo pede uma ferramenta própria.',en:'Varying the location and type of AI widens repertoire and exposes biases; each stage of the creative process calls for its own tool.',fr:'Varier l’origine et le type d’IA élargit le répertoire et expose les biais ; chaque étape du processus créatif appelle son propre outil.',zh:"变换人工智能的来源和类型，可以拓宽积累并暴露偏见；创作过程的每个阶段都需要自己的工具。"}},
   {h:{pt:'Registrar e dialogar sobre os Prompt Threads',en:'Record and discuss the Prompt Threads',fr:'Consigner et dialoguer sur les Prompt Threads',zh:"记录并讨论提示词记录"},t:{pt:'Documentar e discutir a sequência de prompts permite avaliar com mais profundidade o direcionador da criação, isto é, o que levou a cada decisão.',en:'Documenting and discussing the sequence of prompts allows a deeper assessment of what drives the creation, that is, what led to each decision.',fr:'Documenter et discuter la séquence de prompts permet d’évaluer plus en profondeur le moteur de la création, c’est-à-dire ce qui a mené à chaque décision.',zh:"记录并讨论提示词的序列，能更深入地评估创作的驱动力，也就是每个决定背后的缘由。"}},
   {h:{pt:'Hibridizar inteligência humana, IA e artesania',en:'Hybridise human intelligence, AI and craft',fr:'Hybrider intelligence humaine, IA et artisanat',zh:"让人的智能、人工智能与手工艺融合"},t:{pt:'Equipes que produziram protótipos físicos e/ou digitais validaram melhor seus conceitos, e a integração com a IA permitiu acabamentos superiores aos de trabalhos feitos sem esse apoio.',en:'Teams that produced physical and/or digital prototypes validated their concepts better, and integration with AI allowed finishes superior to work done without that support.',fr:'Les équipes qui ont produit des prototypes physiques et/ou numériques ont mieux validé leurs concepts, et l’intégration avec l’IA a permis des finitions supérieures à celles d’un travail sans ce soutien.',zh:"制作了实体和/或数字原型的团队，对概念的验证更充分，与人工智能结合后的完成度，也高于没有这种支持的作品。"}}],
  open_h:{pt:'O que fica em aberto',en:'What remains open',fr:'Ce qui reste ouvert',zh:"仍然悬而未决的问题"},
  open:[
   {h:{pt:'O critério sobrevive ao longo do tempo?',en:'Does judgement survive over time?',fr:'Le jugement survit-il dans le temps ?',zh:"判断力能经得起时间吗？"},t:{pt:'Os diários medem um momento. Seguir a mesma turma em novos projetos mostraria se o repertório se consolida ou se terceiriza.',en:'The logbooks measure one moment. Following the same class in new projects would show whether repertoire consolidates or is outsourced.',fr:'Les journaux mesurent un moment. Suivre la même classe sur de nouveaux projets montrerait si le répertoire se consolide ou s’externalise.',zh:"日志只衡量某一个时刻。让同一个班级在新项目中继续跟踪，才能看出积累是被巩固，还是被外包。"}},
   {h:{pt:'E sem IA?',en:'And without AI?',fr:'Et sans IA ?',zh:"没有人工智能会怎样？"},t:{pt:'Falta um grupo de controle trabalhando o mesmo case sem IA para separar o efeito da ferramenta do efeito do tema.',en:'There is no control group working the same case without AI to separate the effect of the tool from the effect of the theme.',fr:'Il manque un groupe témoin travaillant le même cas sans IA pour séparer l’effet de l’outil de celui du thème.',zh:"缺少一个对照组：用同一个案例、不使用人工智能，来区分工具的影响和主题的影响。"}},
   {h:{pt:'Língua, origem e viés',en:'Language, origin and bias',fr:'Langue, origine et biais',zh:"语言、来源与偏见"},t:{pt:'Os grupos trabalharam em português, inglês e francês, com IAs de origens distintas. Quanto isso moldou a leitura da Paulista?',en:'Groups worked in Portuguese, English and French, with AIs of distinct origins. How much did this shape the reading of Paulista?',fr:'Les groupes ont travaillé en portugais, anglais et français, avec des IA d’origines distinctes. Dans quelle mesure cela a-t-il façonné la lecture de la Paulista ?',zh:"各组用葡萄牙语、英语和法语工作，所用的人工智能来源各不相同。这在多大程度上塑造了对保利斯塔的解读？"}},
   {h:{pt:'Território real × território lido',en:'Real territory × territory as read',fr:'Territoire réel × territoire lu',zh:"真实的场地 × 被阅读的场地"},t:{pt:'Quanto do conhecimento da avenida veio do campo, do corpo e da escuta, e quanto veio de texto? Onde a IA não alcança?',en:'How much knowledge of the avenue came from fieldwork, the body and listening, and how much from text? Where does AI not reach?',fr:'Quelle part de la connaissance de l’avenue vient du terrain, du corps et de l’écoute, et quelle part du texte ? Où l’IA n’arrive-t-elle pas ?',zh:"对这条大道的认识，有多少来自实地考察、身体和倾听，又有多少来自文字？人工智能在哪里够不到？"}},
   {h:{pt:'Autoria: de onde vem o conhecimento da IA?',en:'Authorship: where does AI’s knowledge come from?',fr:'Autorité créative : d’où vient le savoir de l’IA ?',zh:"创作权：人工智能的知识来自哪里？"},t:{pt:'De que base de conhecimento a IA parte, e como ela influencia a criação? Quem responde pelos vieses e como creditar o que foi gerado?',en:'What body of knowledge does AI draw on, and how does it shape creation? Who answers for the biases, and how should generated work be credited?',fr:'Sur quelle base de connaissances l’IA s’appuie-t-elle, et comment influence-t-elle la création ? Qui répond des biais, et comment créditer ce qui est généré ?',zh:"人工智能依据的是怎样的知识体系，它又如何塑造创作？谁来为偏见负责，生成的作品该如何署名？"}},
   {h:{pt:'Custo: qual o preço de criar com IA?',en:'Cost: what is the price of creating with AI?',fr:'Coût : quel est le prix de créer avec l’IA ?',zh:"成本：用人工智能创作的代价是什么？"},t:{pt:'Dimensionar o impacto ambiental, econômico e social do processo de criação do design com IA, inclusive iterar dezenas de imagens, seria um novo estudo interessante.',en:'Sizing the environmental, economic and social impact of the design creation process with AI, including iterating dozens of images, would make an interesting new study.',fr:'Mesurer l’impact environnemental, économique et social du processus de création en design avec l’IA, y compris l’itération de dizaines d’images, ferait une nouvelle étude intéressante.',zh:"衡量用人工智能进行设计创作的环境、经济与社会影响，包括反复迭代数十张图像，会是一项有意思的新研究。"}},
   {h:{pt:'Acesso: quem pode criar com IA?',en:'Access: who can create with AI?',fr:'Accès : qui peut créer avec l’IA ?',zh:"获取：谁能用人工智能创作？"},t:{pt:'Como a falta de acesso aos recursos necessários para usar a IA afeta a educação em design em escolas e sociedades com menos infraestrutura? No futuro, os estúdios de design sem a infraestrutura necessária teriam uma desvantagem competitiva?',en:'How does limited access to the resources needed to use AI affect design education in schools and societies with less infrastructure? In the future, would design studios without the necessary infrastructure be at a competitive disadvantage?',fr:'Comment l’accès limité aux ressources nécessaires pour utiliser l’IA affecte-t-il l’enseignement du design dans les écoles et sociétés moins équipées ? À l’avenir, les studios de design sans l’infrastructure nécessaire auraient-ils un désavantage concurrentiel ?',zh:"在基础设施较少的学校和社会里，使用人工智能所需资源的获取受限，会如何影响设计教育？将来，缺少必要基础设施的设计工作室会处于竞争劣势吗？"}},
   {h:{pt:'Economia de tokens: qual a nova infraestrutura da educação?',en:'Token economy: what is the new infrastructure of education?',fr:'Économie des tokens : quelle nouvelle infrastructure pour l’éducation ?',zh:"代币经济：教育的新基础设施是什么？"},t:{pt:'Em uma economia baseada em tokens como acesso à produtividade criativa, qual seria a nova infraestrutura da educação?',en:'In an economy based on tokens as access to creative productivity, what would the new infrastructure of education be?',fr:'Dans une économie fondée sur les tokens comme accès à la productivité créative, quelle serait la nouvelle infrastructure de l’éducation ?',zh:"在一个以代币作为创意生产力入口的经济中，教育的新基础设施会是什么？"}},
   {h:{pt:'Sistemas (4ª ordem) são o limite?',en:'Are systems (4th order) the limit?',fr:'Les systèmes (4e ordre) sont-ils la limite ?',zh:"系统（第 4 层级）是极限吗？"},t:{pt:'No Tema C a IA ajudou a ler, mas as decisões dependem de governança, regras e atores. Há um ponto em que ela deixa de ser parceira?',en:'In Theme C AI helped read, but decisions depend on governance, rules and actors. Is there a point where it stops being a partner?',fr:'Au Thème C l’IA a aidé à lire, mais les décisions dépendent de gouvernance, de règles et d’acteurs. Y a-t-il un point où elle cesse d’être partenaire ?',zh:"在主题 C 中，人工智能帮助阅读，但决定取决于治理、规则和参与方。是否存在一个点，它不再是伙伴？"}}],

 {id:'a1',tema:'A',col:'#A07447',pal:'a1',typo:['serif','tech'],geo:['org'],poet:'pause',
  scores:[4,5,4,4,3,5],
  title:{pt:'Pérgola Paulista 2050',en:'Paulista Pergola 2050',fr:'Pergola Paulista 2050',zh:"保利斯塔凉亭 2050"},
  concept:{pt:'Uma pérgola em forma de árvore, com copa de madeira, vegetação e uma cortina d’água que projeta conteúdo cultural. Oferece sombra e assento, e vira ponto de encontro e palco informal. O processo está documentado em quatro pôsteres e 16 prompts.',en:'A tree-shaped pergola with a timber canopy, planting and a water curtain that projects cultural content. It gives shade and seating and becomes a meeting point and informal stage. The process is documented in four posters and 16 prompts.',fr:'Une pergola en forme d’arbre, à canopée de bois, végétation et rideau d’eau projetant du contenu culturel. Elle offre ombre et assise, et devient lieu de rencontre et scène informelle. Le processus est documenté en quatre affiches et 16 prompts.',zh:"一个树形凉亭，木质顶篷，配有植物和投射文化内容的水幕。它提供遮荫与座位，成为聚会点和即兴舞台。过程记录在四张海报和 16 条提示词里。"},
  diff:{pt:'É o único ensaio com o fio completo do processo exposto: contexto, insights, ideias e solução em quatro pôsteres, mais o registro do que a IA propôs e do que o grupo manteve ou rejeitou.',en:'The only essay with the full thread of its process exposed: context, insights, ideas and solution in four posters, plus a record of what AI proposed and what the group kept or rejected.',fr:'Le seul essai dont tout le fil du processus est exposé : contexte, insights, idées et solution en quatre affiches, plus le registre de ce que l’IA a proposé et de ce que le groupe a gardé ou rejeté.',zh:"唯一把完整的过程脉络展示出来的作品：四张海报呈现情境、洞察、想法与方案，另有一份记录，写明人工智能提出了什么、小组保留或舍弃了什么。"},
  assets:[{t:'poster',i:'a1_p4',c:{pt:'Pôster final',en:'Final poster',fr:'Affiche finale',zh:"最终海报"}},{t:'image',i:'a1_r1',c:{pt:'Render da pérgola na avenida',en:'Render of the pergola on the avenue',fr:'Rendu de la pergola sur l’avenue',zh:"凉亭在大道上的渲染图"}},{t:'poster',i:'a1_p1',c:{pt:'Pôster 1 · Contexto',en:'Poster 1 · Context',fr:'Affiche 1 · Contexte',zh:"海报 1 · 情境"}},{t:'poster',i:'a1_p2',c:{pt:'Pôster 2 · Insights',en:'Poster 2 · Insights',fr:'Affiche 2 · Insights',zh:"海报 2 · 洞察"}},{t:'poster',i:'a1_p3',c:{pt:'Pôster 3 · Ideias',en:'Poster 3 · Ideas',fr:'Affiche 3 · Idées',zh:"海报 3 · 想法"}},{t:'doc',i:'a1_sheet',c:{pt:'Prancha: planta, elevações e corte',en:'Sheet: plan, elevations and section',fr:'Planche : plan, élévations et coupe',zh:"图版：平面、立面与剖面"}},{t:'image',i:'a1_r2',c:{pt:'Render ao pôr do sol',en:'Render at sunset',fr:'Rendu au coucher du soleil',zh:"日落时分的渲染图"}},{t:'photo',i:'a1_ph',c:{pt:'Banca final',en:'Final review',fr:'Jury final',zh:"最终评审"}}]},
 {id:'a2',tema:'A',col:'#54657E',pal:'a2',typo:['grot'],geo:['mod'],poet:'drift',
  scores:[4,4,4,3,5,3],
  title:{pt:'Divagar',en:'Divagar',fr:'Divagar',zh:"Divagar"},
  concept:{pt:'Placas modulares de alumínio escovado que o público reorganiza para sentar, deitar e contemplar a avenida. Uma proposta de desacelerar sem programa: a poética da deriva em um objeto simples.',en:'Modular brushed-aluminium panels that the public rearranges to sit, lie down and contemplate the avenue. A proposal to slow down without a programme: the poetics of drifting in a simple object.',fr:'Panneaux modulaires en aluminium brossé que le public réorganise pour s’asseoir, s’allonger et contempler l’avenue. Une proposition de ralentir sans programme : la poétique de la dérive dans un objet simple.',zh:"可模块化的拉丝铝板，公众可自行重新排列，用来坐、躺和凝视大道。一个无需节目安排的放慢提议：在简单物件里体现漫游的诗意。"},
  diff:{pt:'É o ensaio mais simples e o mais fácil de construir: um módulo repetível, em monocromia, cuja ideia é oferecer tempo e não conteúdo.',en:'The simplest and easiest to build: a repeatable module, in monochrome, whose idea is to offer time rather than content.',fr:'Le plus simple et le plus facile à construire : un module répétable, en monochromie, dont l’idée est d’offrir du temps plutôt que du contenu.',zh:"最简单、最容易建造的一个：一个可重复的模块，单色，其想法是提供时间，而不是内容。"},
  assets:[{t:'poster',i:'a2_poster',c:{pt:'Pôster “Divagar”',en:'“Divagar” poster',fr:'Affiche « Divagar »',zh:"“Divagar”海报"}},{t:'photo',i:'a2_ph1',c:{pt:'Pôster na banca final',en:'Poster at the final review',fr:'Affiche au jury final',zh:"最终评审时的海报"}},{t:'photo',i:'a2_ph2',c:{pt:'Mesa do grupo',en:'Group table',fr:'Table du groupe',zh:"小组的桌子"}}]},
 {id:'a3',tema:'A',col:'#B5453A',pal:'a3',typo:['grot','hand'],geo:['mod'],poet:'museum',
  scores:[4,5,4,5,5,4],
  title:{pt:'Bancos-vitrine das instituições',en:'Institution display benches',fr:'Bancs-vitrines des institutions',zh:"机构展示长椅"},
  concept:{pt:'A avenida reúne uma oferta cultural excepcional, mas nada liga as instituições entre si: há poucos lugares para sentar, nenhuma leitura clara do que a avenida é e nenhuma história que conecte os edifícios. Para o trecho MASP–Consolação em 2050, o projeto propõe bancos que prolongam o edifício vizinho e carregam um material, um sinal ou um pedaço da sua história: o Corea Bench (concreto aparente e vidro negro, do Centro Cultural Coreano), o Tokyo House Bench (ripas de madeira em alturas irregulares, eco da fachada da Japan House) e o MASP Bench (aço vermelho e laje de concreto). Um QR code em cada banco leva ao conteúdo da instituição, e, de parada em parada, a avenida se lê como uma só história, sem guia.',en:'The avenue holds an exceptional cultural offer, but nothing links the institutions to each other: few places to sit, no clear reading of what the avenue is, and no story connecting the buildings. For the MASP–Consolação stretch in 2050, the project proposes benches that extend the neighbouring building and carry a material, a sign or a piece of its history: the Corea Bench (fair-faced concrete and black glass, from the Korean Cultural Centre), the Tokyo House Bench (timber slats of irregular heights, echoing Japan House’s façade) and the MASP Bench (red steel and a concrete slab). A QR code on each bench leads to the institution’s content, and, stop by stop, the avenue can be read as a single story, without a guide.',fr:'L’avenue concentre une offre culturelle exceptionnelle, mais rien ne relie les institutions entre elles : peu de places où s’asseoir, aucune lecture claire de ce qu’est l’avenue et aucune histoire reliant les bâtiments. Pour le tronçon MASP–Consolação en 2050, le projet propose des bancs qui prolongent le bâtiment voisin et portent un matériau, un signe ou un morceau de son histoire : le Corea Bench (béton brut et verre noir, du Centre culturel coréen), le Tokyo House Bench (lattes de bois de hauteurs irrégulières, écho de la façade de la Japan House) et le MASP Bench (acier rouge et dalle de béton). Un QR code sur chaque banc mène au contenu de l’institution et, d’étape en étape, l’avenue se lit comme une seule histoire, sans guide.',zh:"这条大道拥有出色的文化资源，但机构之间没有任何联系：可坐的地方很少，没有对大道是什么的清晰解读，也没有把这些建筑串联起来的故事。针对 2050 年的 MASP–Consolação 路段，项目提出延伸邻近建筑的长椅，并带上该建筑的一种材料、一个标记或一段历史：Corea Bench（清水混凝土与黑色玻璃，来自韩国文化中心），Tokyo House Bench（高度不一的木条，呼应 Japan House 的立面），以及 MASP Bench（红色钢材与混凝土板）。每张长椅上的二维码链接到该机构的内容，一站一站地走下去，这条大道就成为一个完整的故事，无需向导。"},
  diff:{pt:'É o ensaio mais diretamente ligado à tensão levantada no insight: instituições culturais desconectadas da calçada. A resposta é quase literal, muito factível e bem documentada, com modelagem 3D humana no Fusion 360, uma prancha por banco, renders em situação e um mapa aéreo com as paradas.',en:'The essay most directly tied to the tension raised in its insight: cultural institutions disconnected from the pavement. The answer is almost literal, highly feasible and well documented, with human 3D modelling in Fusion 360, one board per bench, renders in situ and an aerial map of the stops.',fr:'L’essai le plus directement lié à la tension relevée dans son insight : des institutions culturelles déconnectées du trottoir. La réponse est presque littérale, très faisable et bien documentée, avec modélisation 3D humaine dans Fusion 360, une planche par banc, des rendus en situation et une carte aérienne des étapes.',zh:"与其洞察中提出的矛盾联系最直接的作品：文化机构与人行道脱节。回应几乎是字面上的，非常可行，记录也很完整，有人工在 Fusion 360 中的 3D 建模、每张长椅一块图版、现场渲染图，以及标出各站点的鸟瞰图。"},

 {id:'a4',tema:'A',col:'#7B5BA8',pal:'a5',typo:['grot','tech'],geo:['org'],poet:'pause',
  scores:[3,5,4,4,3,4],
  title:{pt:'Casulos de som e luz',en:'Cocoons of sound and light',fr:'Cocons de son et de lumière',zh:"声光茧"},
  concept:{pt:'Um mobiliário híbrido: a dimensão cultural de um palco para apresentações e eventos, somada à imersão sensorial de um abrigo. Cascos curvos de madeira e terrazzo, com fio de luz, acolhem quem quer trabalhar, ler ou conversar, sob guarda-sóis luminosos em forma de cogumelo. O storyboard acompanha o uso por 24 horas, de chegar e se instalar a compartilhar, recarregar, assistir a uma apresentação, viver a noite e circular, até um mobiliário sempre acessível. O pôster declara a IA como ferramenta de exploração, e não de substituição.',en:'A hybrid furniture piece: the cultural dimension of a stage for performances and events, combined with the sensory immersion of a shelter. Curved shells of timber and terrazzo, edged with a line of light, welcome those who want to work, read or talk, under luminous mushroom-shaped parasols. The storyboard follows use over 24 hours, from arriving and settling in to sharing, recharging, attending a performance, living the night and moving through, up to furniture that is always accessible. The poster declares AI as a tool for exploration, not for replacement.',fr:'Un mobilier hybride : la dimension culturelle d’une scène pour spectacles et événements, ajoutée à l’immersion sensorielle d’un abri. Des coques courbes de bois et de terrazzo, bordées d’un filet de lumière, accueillent ceux qui veulent travailler, lire ou parler, sous des ombrelles lumineuses en forme de champignon. Le storyboard suit l’usage sur 24 heures, d’arriver et s’installer à partager, se ressourcer, assister à un spectacle, vivre la nuit et circuler, jusqu’à un mobilier toujours accessible. L’affiche déclare l’IA comme outil d’exploration, non de remplacement.',zh:"一件混合型家具：既有可供演出与活动的舞台的文化属性，又有庇护所的感官沉浸。弧形的木材与水磨石外壳，边缘镶着一条灯带，在发光的蘑菇形遮阳伞下，迎接想工作、阅读或交谈的人。分镜跟随 24 小时的使用，从到达、安顿，到分享、恢复精力、观看演出、体验夜晚和穿行，直到一件始终可用的家具。海报把人工智能定位为探索工具，而不是替代品。"},
  diff:{pt:'É o ensaio que melhor mostra o mobiliário em uso ao longo do dia e da noite, em um storyboard de oito momentos e uma linha do tempo de hora em hora. E declara no pôster o que rejeitou ou retrabalhou da IA: estética genérica ou irrealista, propostas fora do contexto local e resultados sem escala humana, identidade cultural ou factibilidade.',en:'The essay that best shows the furniture in use across day and night, in an eight-moment storyboard and an hour-by-hour timeline. And it declares on the poster what it rejected or reworked from AI: generic or unrealistic aesthetics, proposals not adapted to the local context, and results lacking human scale, cultural identity or feasibility.',fr:'L’essai qui montre le mieux le mobilier en usage de jour comme de nuit, dans un storyboard de huit moments et une frise heure par heure. Et il déclare sur l’affiche ce qu’il a rejeté ou retravaillé de l’IA : esthétique générique ou irréaliste, propositions non adaptées au contexte local et résultats sans échelle humaine, identité culturelle ou faisabilité.',zh:"最能展示家具在白天与夜晚使用情况的作品，有八个时刻的分镜和逐小时的时间线。它还在海报上声明了从人工智能处舍弃或重做的内容：泛化或不现实的审美、不适合本地情境的提案、缺乏人的尺度、文化身份或可行性的结果。"},
  assets:[{t:'poster',i:'a5_poster',c:{pt:'Pôster “Avenida Paulista 2050”: ouvir, respirar, vibrar, compartilhar',en:'“Avenida Paulista 2050” poster: listen, breathe, vibrate, share',fr:'Affiche « Avenida Paulista 2050 » : écouter, respirer, vibrer, partager',zh:"“保利斯塔大道 2050”海报：倾听、呼吸、振动、分享"}},{t:'image',i:'a5_r1',c:{pt:'Render ao entardecer',en:'Render at dusk',fr:'Rendu au crépuscule',zh:"黄昏时的渲染图"}},{t:'image',i:'a5_r2',c:{pt:'Render de dia',en:'Render by day',fr:'Rendu de jour',zh:"白天的渲染图"}},{t:'doc',i:'a5_story',c:{pt:'Storyboard dos usos, das 6h às 24h',en:'Storyboard of uses, from 6 am to midnight',fr:'Storyboard des usages, de 6 h à minuit',zh:"使用分镜，从早上 6 点到午夜"}},{t:'image',i:'a5_strip',c:{pt:'Jornada do usuário em oito momentos',en:'User journey in eight moments',fr:'Parcours de l’usager en huit moments',zh:"八个时刻的用户旅程"}},{t:'image',i:'a5_24h',c:{pt:'Linha do tempo de 24 horas',en:'24-hour timeline',fr:'Frise de 24 heures',zh:"24 小时时间线"}}]},
 {id:'b1',tema:'B',col:'#3B4FA8',pal:'b1',typo:['serif','grot'],geo:['flow','org'],poet:'voice',
  scores:[5,5,5,5,3,4],
  title:{pt:'Paulista 24/7: uma avenida, identidades vivas',en:'Paulista 24/7: an avenue of living identities',fr:'Paulista 24/7 : une avenue, des identités vivantes',zh:"Paulista 24/7：一条有活的身份的大道"},
  concept:{pt:"Fachadas de luz que reagem à aproximação das pessoas: a fachada calma, o primeiro contato, o florescer e a ativação total, até ocupar a rua com ondas de cor. Um segundo storyboard aplica a mesma lógica ao MASP, em homenagem a Tarsila do Amaral, com a fresca que se anima e uma “tela viva” inspirada no Abaporu. Os pôsteres usam duotone azul e vermelho.",en:"Light façades that react to people approaching: the calm façade, first contact, bloom and full activation, until waves of colour take over the street. A second storyboard applies the same logic to MASP, in homage to Tarsila do Amaral, with the fresco that comes alive and a “living canvas” inspired by Abaporu. The posters use blue and red duotone.",fr:"Des façades de lumière qui réagissent à l’approche des gens : la façade calme, le premier contact, l’éclosion et l’activation totale, jusqu’à ce que des vagues de couleur occupent la rue. Un second storyboard applique la même logique au MASP, en hommage à Tarsila do Amaral, avec la fresque qui s’anime et une « toile vivante » inspirée d’Abaporu. Les affiches emploient un duotone bleu et rouge.",zh:"会对靠近的人作出反应的光立面：平静的立面、首次接触、绽放与完全激活，直到色彩的浪潮占领街道。第二组分镜把同样的逻辑用到 MASP，向塔西拉·多·阿马拉尔（Tarsila do Amaral）致敬，让壁画活起来，并有一幅受《阿巴波鲁》启发的“活的画布”。海报采用蓝红双色调。"},
  diff:{pt:'É o ensaio que melhor responde à pergunta “peça gráfica dinâmica para o mundo”: tem um vídeo com início, meio e fim, uma linguagem visual inconfundível e uma ideia (a avenida muda de identidade) fácil de comunicar.',en:'The essay that best answers “dynamic graphic piece for the world”: a video with beginning, middle and end, an unmistakable visual language and an idea (the avenue changes identity) that is easy to communicate.',fr:'L’essai qui répond le mieux à « pièce graphique dynamique pour le monde » : une vidéo avec début, milieu et fin, un langage visuel reconnaissable et une idée (l’avenue change d’identité) facile à communiquer.',zh:"最能回应“面向世界的动态图形作品”的作品：一段有开头、中间和结尾的视频，鲜明的视觉语言，以及一个容易传播的想法（大道换了身份）。"},

 {id:'b2',tema:'B',col:'#2E8BC0',pal:'b2',typo:['grot'],geo:['lay'],poet:'choose',
  scores:[4,5,3,5,3,3],
  title:{pt:'Choose your Paulista',en:'Choose your Paulista',fr:'Choose your Paulista',zh:"选择你的保利斯塔"},
  concept:{pt:"Uma avenida que se adapta ao ritmo do dia e às necessidades de quem a usa: às 8h, social (mobiliário interativo e telas que aproximam pessoas à distância); ao meio-dia, natureza (fachadas verdes, dados botânicos visíveis e dispositivos biofílicos); às 16h, compras (vitrines interativas e serviços personalizados); às 20h, cultura (instalações de luz e projeções artísticas). O segundo pôster, “Avenida Paulista 24/7: um povo, uma cidade, uma experiência compartilhada”, parte de cinco tensões (muitas identidades e uma imagem fragmentada, dia e noite, local e global, espectador e participante, físico e digital), tem Times Square, Piccadilly Circus e Champs-Élysées como benchmarks, cita Rafael Lozano-Hemmer, teamLab e Refik Anadol, e formula o problema: como tornar a Paulista um lugar reconhecível no mundo por uma experiência interativa que evolui com as pessoas e seus ritmos.",en:"An avenue that adapts to the rhythm of the day and the needs of its users: at 8 am, social (interactive furniture and screens that bring people together across distance); at midday, nature (green façades, visible botanical data and biophilic devices); at 4 pm, shopping (interactive storefronts and personalised services); at 8 pm, culture (light installations and artistic projections). The second poster, “Avenida Paulista 24/7: a people, a city, a shared experience”, starts from five tensions (many identities and a fragmented image, day and night, local and global, spectator and participant, physical and digital), takes Times Square, Piccadilly Circus and the Champs-Élysées as benchmarks, cites Rafael Lozano-Hemmer, teamLab and Refik Anadol, and states the problem: how can Paulista become a globally recognisable place through an interactive experience that evolves with its people and rhythms.",fr:"Une avenue qui s’adapte au rythme de la journée et aux besoins de ses usagers : à 8 h, social (mobilier interactif et écrans qui rapprochent les gens à distance) ; à midi, nature (façades vertes, données botaniques visibles et dispositifs biophiliques) ; à 16 h, shopping (vitrines interactives et services personnalisés) ; à 20 h, culture (installations lumineuses et projections artistiques). La seconde affiche, « Avenida Paulista 24/7 : un peuple, une ville, une expérience partagée », part de cinq tensions (plusieurs identités et une image fragmentée, jour et nuit, local et global, spectateur et participant, physique et numérique), prend Times Square, Piccadilly Circus et les Champs-Élysées comme références, cite Rafael Lozano-Hemmer, teamLab et Refik Anadol, et pose le problème : comment la Paulista peut-elle devenir un lieu reconnaissable dans le monde grâce à une expérience interactive qui évolue avec ses gens et ses rythmes.",zh:"一条随一天的节奏和使用者需求而调整的大道：早上 8 点是社交（互动家具和让人隔空相聚的屏幕）；中午是自然（绿色立面、可见的植物数据和亲生物装置）；下午 4 点是购物（互动橱窗和个性化服务）；晚上 8 点是文化（灯光装置和艺术投影）。第二张海报“保利斯塔大道 24/7：一个民族，一座城市，一份共享的体验”从五个矛盾出发（多种身份与破碎的形象、白天与夜晚、本地与全球、旁观者与参与者、实体与数字），以时代广场、皮卡迪利广场和香榭丽舍大道为参照，引用了拉斐尔·洛萨诺-海默、teamLab 和 Refik Anadol，并提出问题：保利斯塔如何借助一种随人和节奏演变的互动体验，成为全球可辨认的地方。"},
  diff:{pt:"É o ensaio com a pesquisa mais ampla do tema: tensões, visão, benchmarks globais e referências de arte levam a quatro “Paulistas” ao longo do dia e a um vídeo que as percorre, das 8h às 20h, até o mapa isométrico de serviços e interações. A ressalva é que as cenas carregam o vocabulário padrão da IA (neon, hologramas, marcas inventadas), o que enfraquece a assinatura.",en:"The essay with the widest research in the theme: tensions, vision, global benchmarks and art references lead to four “Paulistas” through the day and to a video that walks through them, from 8 am to 8 pm, up to the isometric map of services and interactions. The caveat is that the scenes carry AI’s default vocabulary (neon, holograms, invented brands), which weakens the signature.",fr:"L’essai à la recherche la plus large du thème : tensions, vision, références mondiales et références artistiques mènent à quatre « Paulistas » au fil de la journée et à une vidéo qui les parcourt, de 8 h à 20 h, jusqu’à la carte isométrique des services et interactions. La réserve : les scènes portent le vocabulaire par défaut de l’IA (néon, hologrammes, marques inventées), ce qui affaiblit la signature.",zh:"该主题中调研最广的作品：矛盾、愿景、全球参照与艺术参照，引出一天中的四个“保利斯塔”，以及一段从早上 8 点走到晚上 8 点的视频，直到服务与互动的等距地图。需要提醒的是，场景带着人工智能的默认词汇（霓虹、全息、虚构品牌），这削弱了个人印记。"},
  assets:[{t:'poster',i:'b2_choose',c:{pt:"Pôster “Choose your Paulista”: quatro momentos do dia",en:"“Choose your Paulista” poster: four moments of the day",fr:"Affiche « Choose your Paulista » : quatre moments de la journée",zh:"“选择你的保利斯塔”海报：一天中的四个时刻"}},{t:'poster',i:'b2_247',c:{pt:"Pôster “Avenida Paulista 24/7”: tensões, visão e benchmarks",en:"“Avenida Paulista 24/7” poster: tensions, vision and benchmarks",fr:"Affiche « Avenida Paulista 24/7 » : tensions, vision et références",zh:"“保利斯塔大道 24/7”海报：矛盾、愿景与参照"}},{t:'image',i:'axo',c:{pt:"Esquema da iluminação e dos serviços ao longo do dia (axonometria)",en:"Scheme of lighting and services through the day (axonometry)",fr:"Schéma de l’éclairage et des services au fil de la journée (axonométrie)",zh:"一天中的照明与服务示意（轴测图）"}},{t:'image',i:'b2_nat',c:{pt:"Modo natureza",en:"Nature mode",fr:"Mode nature",zh:"自然模式"}},{t:'image',i:'b2_cul',c:{pt:"Modo cultura",en:"Culture mode",fr:"Mode culture",zh:"文化模式"}},{t:'image',i:'b2_sho',c:{pt:"Modo compras",en:"Shopping mode",fr:"Mode shopping",zh:"购物模式"}},{t:'image',i:'b2_soc',c:{pt:"Modo encontro",en:"Social mode",fr:"Mode rencontre",zh:"社交模式"}},{t:'image',i:'b2_r1',c:{pt:"Atmosfera noturna",en:"Night atmosphere",fr:"Atmosphère nocturne",zh:"夜晚氛围"}},{t:'image',i:'b2_r3',c:{pt:"Avenida com natureza digital",en:"Avenue with digital nature",fr:"Avenue à la nature numérique",zh:"带有数字自然的大道"}},{t:'photo',i:'b2_ph',c:{pt:"Pôsteres “Choose your Paulista” na banca",en:"“Choose your Paulista” posters at the review",fr:"Affiches « Choose your Paulista » au jury",zh:"评审时的“选择你的保利斯塔”海报"}}]},

  title:{pt:'Paulista Talks: all day long, nobody answers',en:'Paulista Talks: all day long, nobody answers',fr:'Paulista Talks : all day long, nobody answers',zh:"Paulista Talks：整日在说话，无人回应"},
  concept:{pt:"Diagnóstico: a Paulista fala o dia inteiro, em uma só direção e com a mesma voz às 8h e às 4h, e ninguém responde. A visão para 2050 é uma avenida que responde ao corpo, ao som, ao ar e ao passo. O segundo pôster fecha a direção como “a avenida como relógio”: oito elementos do espaço público (banco, ponto de ônibus, árvore, MASP, quiosque, metrô, Japan House e jardim) mudam de capítulo no mesmo minuto, em quatro períodos do dia: origens (1891–1920), ascensão (1950–1970), cultura e protesto (1980–2020) e Paulista 2050. Nada toca a fachada: a luz projetada conta a história da própria avenida, onde ela aconteceu. A IA não inventa o passado da Paulista: ela o ordena, o sincroniza e o veste. A próxima etapa é prototipar uma hora, em um lugar, no vão do MASP ao entardecer.",en:"Diagnosis: Paulista talks all day long, in one direction and in the same voice at 8 am and 4 am, and nobody answers. The 2050 vision is an avenue that answers the body, the sound, the air and the step. The second poster closes the direction as “the avenue as a clock”: eight elements of public space (bench, bus stop, tree, MASP, kiosk, metro, Japan House and garden) change chapter at the same minute, in four periods of the day: origins (1891–1920), rise (1950–1970), culture and protest (1980–2020) and Paulista 2050. Nothing touches the façade: projected light tells the avenue’s own history, where it happened. AI does not invent Paulista’s past: it sorts, times and dresses it. The next step is to prototype one hour, in one place, on the MASP esplanade at dusk.",fr:"Diagnostic : la Paulista parle toute la journée, dans un seul sens et avec la même voix à 8 h et à 4 h, et personne ne répond. La vision 2050 est une avenue qui répond au corps, au son, à l’air et au pas. La seconde affiche referme la direction comme « l’avenue comme horloge » : huit éléments de l’espace public (banc, arrêt de bus, arbre, MASP, kiosque, métro, Japan House et jardin) changent de chapitre à la même minute, en quatre périodes de la journée : origines (1891–1920), essor (1950–1970), culture et protestation (1980–2020) et Paulista 2050. Rien ne touche la façade : la lumière projetée raconte l’histoire propre de l’avenue, là où elle s’est passée. L’IA n’invente pas le passé de la Paulista : elle le trie, le synchronise et l’habille. La prochaine étape est de prototyper une heure, en un lieu, sur l’esplanade du MASP au crépuscule.",zh:"诊断：保利斯塔整天在说话，朝着一个方向，早上 8 点和凌晨 4 点用同一种声音，而无人回应。2050 年的愿景，是一条能回应身体、声音、空气和脚步的大道。第二张海报把方向收束为“作为时钟的大道”：公共空间的八个元素（长椅、公交站、树、MASP、售货亭、地铁、Japan House 和花园）在同一分钟换到下一章，一天分为四个时段：起源（1891–1920）、崛起（1950–1970）、文化与抗议（1980–2020）和保利斯塔 2050。没有任何东西触碰立面：投射的光讲述的是这条大道自己的历史，就在它发生的地方。人工智能不虚构保利斯塔的过去，它只负责整理、定时和包装。下一步是在傍晚的 MASP 广场上，原型测试一小时、一个地点。"},
  diff:{pt:"É o ensaio que mais se transformou e que melhor documenta a própria evolução: do diagnóstico (a avenida fala sem resposta) passa por três versões (quatro sentidos sem tela, edifícios como narradores, a avenida como relógio) e define com clareza o papel da IA: ela pesquisa, sincroniza e adapta; o grupo decide que história é contada e onde. Também é o mais factível do tema, porque projeta luz e não mexe na matéria do patrimônio.",en:"The essay that transformed the most and best documents its own evolution: from the diagnosis (the avenue talks without reply) it goes through three versions (four senses with no screen, buildings as narrators, the avenue as a clock) and defines AI’s role clearly: it researches, times and adapts; the group decides which history is told and where. It is also the most feasible in the theme, because it projects light and does not touch heritage fabric.",fr:"L’essai qui s’est le plus transformé et qui documente le mieux sa propre évolution : du diagnostic (l’avenue parle sans réponse), il passe par trois versions (quatre sens sans écran, bâtiments comme narrateurs, l’avenue comme horloge) et définit clairement le rôle de l’IA : elle cherche, synchronise et adapte ; le groupe décide quelle histoire est racontée et où. C’est aussi le plus faisable du thème, car il projette de la lumière sans toucher à la matière du patrimoine.",zh:"变化最大、也最好地记录自身演变的作品：从诊断（大道在说话却没有回应）出发，经过三个版本（没有屏幕的四种感官、建筑作为叙述者、作为时钟的大道），并清楚界定了人工智能的角色：它负责调研、定时和适配；讲哪一段历史、在哪里讲，由小组决定。它也是该主题中最可行的，因为它投射的是光，不触碰遗产的物质。"},
  assets:[{t:'poster',i:'b3_p1',c:{pt:"Pôster 1 · “Paulista talks all day long. Nobody answers.”",en:"Poster 1 · “Paulista talks all day long. Nobody answers.”",fr:"Affiche 1 · « Paulista talks all day long. Nobody answers. »",zh:"海报 1 ·“Paulista talks all day long. Nobody answers.”"}},{t:'poster',i:'b3_p2',c:{pt:"Pôster 2 · “Uma avenida. Um relógio.”",en:"Poster 2 · “One avenue. One clock.”",fr:"Affiche 2 · « Une avenue. Une horloge. »",zh:"海报 2 ·“One avenue. One clock.”"}},{t:'photo',i:'b3_ph1',c:{pt:"Tela do grupo na banca",en:"Group screen at the review",fr:"Écran du groupe au jury",zh:"评审时小组的屏幕"}},{t:'photo',i:'b3_ph2',c:{pt:"Pôster 1 na banca",en:"Poster 1 at the review",fr:"Affiche 1 au jury",zh:"评审时的海报 1"}}]},

 {id:'b4',tema:'B',col:'#E67966',pal:'b4',typo:['tech','hand'],geo:['lay'],poet:'common',
  scores:[4,5,4,5,5,5],
  title:{pt:'Selo: passaporte digital para uma Paulista viva',en:'Selo: a digital passport for a living Paulista',fr:'Selo : un passeport numérique pour une Paulista vivante',zh:"Selo：活的保利斯塔的数字护照"},
  concept:{pt:'“Selo” é um passaporte digital em que cada experiência na avenida vira um selo, colecionado no local ou à distância, e soma cada percurso a um mapa coletivo. Parte do diagnóstico “a Paulista é uma mídia silenciosa” e transforma o domingo ampliado num sistema de 365 dias: descobrir, viver, colecionar, deixar uma história, compartilhar. Uma história em quadrinhos (Rafael & Julia, domingo, 10h) mostra o uso passo a passo.',en:'“Selo” is a digital passport where each experience on the avenue becomes a stamp, collected on site or remotely, adding each journey to a collective map. It starts from the diagnosis “Paulista is a silent medium” and turns the enhanced Sunday into a 365-day system: discover, experience, collect, leave a story, share. A comic (Rafael & Julia, Sunday, 10 a.m.) shows the use step by step.',fr:'« Selo » est un passeport numérique où chaque expérience sur l’avenue devient un timbre, collecté sur place ou à distance, ajoutant chaque parcours à une carte collective. Il part du diagnostic « la Paulista est un média silencieux » et transforme le dimanche augmenté en système de 365 jours : découvrir, vivre, collectionner, laisser une histoire, partager. Une BD (Rafael & Julia, dimanche, 10 h) montre l’usage pas à pas.',zh:"“Selo”（印章）是一本数字护照：在大道上的每一次体验都成为一枚印章，可以在现场或远程收集，把每一次旅程加入一张集体地图。它从“保利斯塔是一种沉默的媒介”这一诊断出发，把被放大的周日变成一套 365 天的系统：发现、体验、收集、留下故事、分享。一则漫画（Rafael 与 Julia，周日上午 10 点）一步一步地展示用法。"},
  diff:{pt:'É o ensaio com a cadeia de IA mais explícita (conversas de ideação, imagens, código, teste e vídeo de cenário) e uma frase de autoria clara: a IA gerou possibilidades, código e iterações, e as decisões humanas definiram conceito, hierarquia e direção.',en:'The essay with the most explicit AI chain (ideation conversations, images, code, testing and scenario video) and a clear authorship statement: AI generated possibilities, code and iterations, and human decisions defined concept, hierarchy and direction.',fr:'L’essai à la chaîne d’IA la plus explicite (conversations d’idéation, images, code, tests et vidéo de scénario) et une phrase d’autorité claire : l’IA a généré possibilités, code et itérations, les décisions humaines ont défini concept, hiérarchie et direction.',zh:"人工智能链条最清晰的作品（对话式构思、图像、代码、测试和情景视频），并且有明确的创作权声明：人工智能生成可能性、代码和迭代，由人的决定确定概念、层次与方向。"},
  assets:[{t:'poster',i:'b4_selo',c:{pt:'Pôster do app Selo',en:'Selo app poster',fr:'Affiche de l’appli Selo',zh:"Selo 应用海报"}},{t:'poster',i:'b4_story2',c:{pt:'Storyboard: Rafael & Julia, domingo 10h',en:'Storyboard: Rafael & Julia, Sunday 10 a.m.',fr:'Storyboard : Rafael & Julia, dimanche 10 h',zh:"分镜：Rafael 与 Julia，周日上午 10 点"}},{t:'photo',i:'b4_ph',c:{pt:'Protótipo no tablet na banca',en:'Tablet prototype at the review',fr:'Prototype sur tablette au jury',zh:"评审时的平板原型"}}]},

 {id:'c1',tema:'C',col:'#D74743',pal:'c1',typo:['grot','hand'],geo:['lay'],poet:'common',
  scores:[4,5,4,5,4,4],
  title:{pt:'Paulista Viva: habitar o comum',en:'Paulista Viva: dwelling in the common',fr:'Paulista Viva : habiter le commun',zh:"Paulista Viva：栖居于共同体之中"},
  concept:{pt:'Uma instituição cultural a céu aberto no trecho MASP–Consolação, que funciona além do domingo. Quatro camadas (ecológica, física, cultural e invisível) e cinco horários do dia sustentam um sistema de clareiras de sombra, módulos reparáveis e usos propostos pelo público.',en:'An open-air cultural institution on the MASP–Consolação stretch that works beyond Sunday. Four layers (ecological, physical, cultural and invisible) and five times of day support a system of shade clearings, repairable modules and uses proposed by the public.',fr:'Une institution culturelle à ciel ouvert sur le tronçon MASP–Consolação, qui fonctionne au-delà du dimanche. Quatre couches (écologique, physique, culturelle et invisible) et cinq moments du jour soutiennent un système de clairières d’ombre, modules réparables et usages proposés par le public.',zh:"一座位于 MASP–Consolação 路段的露天文化机构，不只在周日运转。四个层面（生态的、物质的、文化的和无形的）和一天中的五个时段，支撑着一套由遮荫空地、可修复模块和公众提出的用途构成的系统。"},
  diff:{pt:'É o ensaio mais explícito sobre seus próprios limites: separa fatos documentados de hipóteses, apresenta três alternativas “a testar” e usa um mapa mental para reabrir o conceito.',en:'The most explicit about its own limits: it separates documented facts from hypotheses, offers three alternatives “to test” and uses a mind map to reopen the concept.',fr:'Le plus explicite sur ses propres limites : il sépare faits documentés et hypothèses, propose trois alternatives « à éprouver » et utilise une carte mentale pour rouvrir le concept.',zh:"对自身局限最坦率的作品：它把有据可查的事实与假设分开，提出三个“待检验”的备选方案，并用思维导图重新打开概念。"},
  assets:[{t:'poster',i:'c1_p1',c:{pt:'Pôster 1 · Processo',en:'Poster 1 · Process',fr:'Affiche 1 · Processus',zh:"海报 1 · 过程"}},{t:'poster',i:'c1_p2',c:{pt:'Pôster 2 · Projeto',en:'Poster 2 · Project',fr:'Affiche 2 · Projet',zh:"海报 2 · 项目"}},{t:'poster',i:'c1_p3',c:{pt:'Visão final modular',en:'Final modular vision',fr:'Vision finale modulaire',zh:"最终的模块化愿景"}},{t:'poster',i:'c1_lab',c:{pt:'Pôster do laboratório: tensões e paradoxos',en:'Lab poster: tensions and paradoxes',fr:'Affiche du labo : tensions et paradoxes',zh:"实验室海报：矛盾与悖论"}},{t:'poster',i:'c1_cod',c:{pt:'Paulista Viva 2050 · habitar o comum',en:'Paulista Viva 2050 · dwelling in the common',fr:'Paulista Viva 2050 · habiter le commun',zh:"Paulista Viva 2050 · 栖居于共同体之中"}},{t:'photo',i:'c1_ph',c:{pt:'Pôsteres e tela na banca',en:'Posters and screen at the review',fr:'Affiches et écran au jury',zh:"评审时的海报与屏幕"}},{t:'doc',i:'c1_mind',c:{pt:'Mapa mental: reabrir o conceito',en:'Mind map: reopening the concept',fr:'Carte mentale : rouvrir le concept',zh:"思维导图：重新打开概念"}}]},
 {id:'c2',tema:'C',col:'#8C2B2B',pal:'c2',typo:['grot','hand'],geo:['flow','lay'],poet:'common',
  scores:[4,5,4,5,3,3],
  title:{pt:'Paulista 2050: cultura é infraestrutura',en:'Paulista 2050: culture = infrastructure',fr:'Paulista 2050 : culture = infrastructure',zh:"保利斯塔 2050：文化 = 基础设施"},
  concept:{pt:"A Paulista já é cultural, então por que a cultura segue fragmentada? A proposta é uma camada cultural contínua, vertical e horizontal: um “arquipélago vertical” de torres com jardins, pontes e passarelas que liga as instituições existentes (MASP, Conjunto Nacional, FIESP, Trianon-MASP, SESC Paulista e Praça do Ciclista) e abre novos espaços públicos 24 horas. Há cultura em cada camada: espaços culturais, espaço público, natureza e clima (sombra, gestão da água da chuva, resfriamento) e mobilidade. Um segundo pôster compara a Paulista de hoje (dominada por carros, com edifícios isolados e pouca oferta cultural) com a de depois de 2050, descreve um programa de 365 dias, da manhã ao domingo, e a jornada de quem usa (chegar, caminhar, descobrir, encontrar, participar, ficar). Responde ao clima com uma infraestrutura cultural adaptativa, diante de uma alta de 2,5 a 4 °C na temperatura e de chuvas 40% mais intensas.",en:"Paulista is already cultural, so why does culture remain fragmented? The proposal is a continuous cultural layer, vertical and horizontal: a “vertical archipelago” of towers with gardens, bridges and walkways that links the existing institutions (MASP, Conjunto Nacional, FIESP, Trianon-MASP, SESC Paulista and Praça do Ciclista) and opens new 24-hour public spaces. There is culture in every layer: cultural spaces, public space, nature and climate (shade, rainwater management, cooling) and mobility. A second poster compares today’s Paulista (car-dominated, with isolated buildings and little cultural offer) with the one after 2050, describes a 365-day programme, from morning to Sunday, and the journey of those who use it (arrive, walk, discover, meet, participate, stay). It answers the climate with an adaptive cultural infrastructure, facing a 2.5 to 4 °C rise in temperature and 40% more intense rain.",fr:"La Paulista est déjà culturelle, alors pourquoi la culture reste-t-elle fragmentée ? La proposition est une couche culturelle continue, verticale et horizontale : un « archipel vertical » de tours avec jardins, ponts et passerelles qui relie les institutions existantes (MASP, Conjunto Nacional, FIESP, Trianon-MASP, SESC Paulista et Praça do Ciclista) et ouvre de nouveaux espaces publics 24 heures sur 24. Il y a de la culture dans chaque couche : espaces culturels, espace public, nature et climat (ombre, gestion de l’eau de pluie, rafraîchissement) et mobilité. Une seconde affiche compare la Paulista d’aujourd’hui (dominée par les voitures, avec des bâtiments isolés et peu d’offre culturelle) à celle d’après 2050, décrit un programme de 365 jours, du matin au dimanche, et le parcours de l’usager (arriver, marcher, découvrir, rencontrer, participer, rester). Elle répond au climat par une infrastructure culturelle adaptative, face à une hausse de 2,5 à 4 °C et à des pluies 40 % plus intenses.",zh:"保利斯塔本来就有文化，那为什么文化依然是碎片化的？这个提案是一层连续的文化层，既垂直又水平：一个“垂直群岛”，由带花园、桥梁和步道的塔楼组成，把现有机构（MASP、Conjunto Nacional、FIESP、Trianon-MASP、SESC Paulista 和 Praça do Ciclista）连起来，并开辟全天 24 小时的新公共空间。每一层都有文化：文化空间、公共空间、自然与气候（遮荫、雨水管理、降温）以及交通。第二张海报把今天的保利斯塔（汽车主导、建筑孤立、文化供给很少）与 2050 年之后的保利斯塔作了对比，描述了一套 365 天的节目，从早晨到周日，以及使用者的旅程（到达、行走、发现、相遇、参与、停留）。它以一种适应性的文化基础设施回应气候，面对的是气温上升 2.5 至 4 °C、降雨强度增加 40%。"},
  diff:{pt:"É o ensaio que mais cresce de uma ideia para a seguinte: um percurso vermelho que liga seis paradas vira um arquipélago vertical, e a conclusão cabe em uma equação (cultura = infraestrutura). Reúne clima, mobilidade e programação 24 horas em uma só camada, e as imagens de concepção ajudam a ler a escala vertical. É também o mais especulativo do tema, e o que menos explica como seria gerido.",en:"The essay that grows the most from one idea to the next: a red route linking six stops becomes a vertical archipelago, and the conclusion fits in an equation (culture = infrastructure). It brings climate, mobility and 24-hour programming into a single layer, and the concept images help read the vertical scale. It is also the most speculative in the theme, and the one that least explains how it would be managed.",fr:"L’essai qui grandit le plus d’une idée à l’autre : un parcours rouge reliant six étapes devient un archipel vertical, et la conclusion tient dans une équation (culture = infrastructure). Il réunit climat, mobilité et programmation 24 heures sur 24 en une seule couche, et les images de conception aident à lire l’échelle verticale. C’est aussi le plus spéculatif du thème, et celui qui explique le moins comment il serait géré.",zh:"从一个想法到下一个想法，成长最多的作品：连接六个站点的红色路线变成了垂直群岛，结论可以写成一个等式（文化 = 基础设施）。它把气候、交通和 24 小时节目安排纳入同一层，而概念图像有助于读懂垂直的尺度。它也是该主题中最具推测性的，也是对如何管理说得最少的。"},
  assets:[{t:'poster',i:'c2_poster',c:{pt:"Pôster 1 · processo: tensão, contexto, pesquisa e direção final",en:"Poster 1 · process: tension, context, research and final direction",fr:"Affiche 1 · processus : tension, contexte, recherche et direction finale",zh:"海报 1 · 过程：矛盾、情境、研究与最终方向"}},{t:'poster',i:'c2_poster2',c:{pt:"Pôster 2 · “Cultura como infraestrutura”: um espaço público cultural 24/7",en:"Poster 2 · “Culture as infrastructure”: a 24/7 cultural public space",fr:"Affiche 2 · « La culture comme infrastructure » : un espace public culturel 24/7",zh:"海报 2 ·“文化作为基础设施”：一个 24/7 的文化公共空间"}},{t:'image',i:'c2_r1',c:{pt:"Render: o arquipélago vertical ao entardecer",en:"Render: the vertical archipelago at sunset",fr:"Rendu : l’archipel vertical au coucher du soleil",zh:"渲染图：日落时的垂直群岛"}},{t:'image',i:'c2_r2',c:{pt:"Render: terraços, pontes e a avenida vista de cima",en:"Render: terraces, bridges and the avenue seen from above",fr:"Rendu : terrasses, ponts et l’avenue vue d’en haut",zh:"渲染图：从高处看露台、桥梁与大道"}},{t:'poster',i:'c2_p2',c:{pt:"Pôster em versão alternativa",en:"Alternative version of the poster",fr:"Version alternative de l’affiche",zh:"海报的另一个版本"}},{t:'photo',i:'c2_ph',c:{pt:"Pôsteres e apresentação na banca",en:"Posters and presentation at the review",fr:"Affiches et présentation au jury",zh:"评审时的海报与展示"}}]},
 {id:'c3',tema:'C',col:'#58452D',pal:'c3',typo:['grot'],geo:['flow'],poet:'museum',
  scores:[4,4,5,4,3,3],
  title:{pt:'A avenida como museu',en:'The avenue as a museum',fr:'L’avenue comme musée',zh:"大道作为博物馆"},
  concept:{pt:'A rua vira extensão da exposição que acontece dentro: obras e fachadas dos museus (MASP, Japan House, Itaú Cultural) se estendem para a calçada, para uma cidade mais cultural e inclusiva.',en:'The street becomes an extension of the exhibition inside: works and façades of the museums (MASP, Japan House, Itaú Cultural) spill onto the pavement, for a more cultural and inclusive city.',fr:'La rue devient le prolongement de l’exposition à l’intérieur : œuvres et façades des musées (MASP, Japan House, Itaú Cultural) se déploient sur le trottoir, pour une ville plus culturelle et inclusive.',zh:"街道成为室内展览的延伸：博物馆（MASP、Japan House、Itaú Cultural）的作品与立面溢出到人行道上，造就一座更有文化、更包容的城市。"},
  diff:{pt:'Tem a melhor síntese poética em uma frase (“a rua é a extensão da exposição”) e uma linguagem visual de colagem em preto e branco, com a cor reservada à arte.',en:'The best poetic synthesis in one sentence (“the street is the extension of the exhibition”) and a black-and-white collage language, with colour reserved for art.',fr:'La meilleure synthèse poétique en une phrase (« la rue prolonge l’exposition ») et un langage de collage en noir et blanc, la couleur étant réservée à l’art.',zh:"一句话里最好的诗意概括（“街道是展览的延伸”），以及黑白拼贴的语言，颜色只留给艺术。"},
  assets:[{t:'poster',i:'c3_poster',c:{pt:'Pôster “The street becomes an extension of the exhibition inside”',en:'Poster “The street becomes an extension of the exhibition inside”',fr:'Affiche « The street becomes an extension of the exhibition inside »',zh:"海报“街道成为室内展览的延伸”"}},{t:'image',i:'c3_ph1',c:{pt:'Colagem: fachada com arte sobre a avenida',en:'Collage: art façade on the avenue',fr:'Collage : façade d’art sur l’avenue',zh:"拼贴：大道上的艺术立面"}},{t:'image',i:'c3_ph2',c:{pt:'Colagem: esculturas na avenida',en:'Collage: sculptures on the avenue',fr:'Collage : sculptures sur l’avenue',zh:"拼贴：大道上的雕塑"}},{t:'photo',i:'c3_ph3',c:{pt:'Mapa e colagens: “The avenue as a museum”',en:'Map and collages: “The avenue as a museum”',fr:'Carte et collages : « The avenue as a museum »',zh:"地图与拼贴：“大道作为博物馆”"}}]},

  concept:{pt:"Uma família de estruturas modulares de madeira e tecido, inspirada na construção minimalista asiática (estruturas leves, madeira tipo bambu, tecido) e adaptada a uma identidade cultural brasileira: a Ágora, lugar de convívio, cultura e criatividade que devolve a avenida às pessoas, inspirado na ágora grega; o Quiosque, que abriga comida, livros ou eventos; o Palco de DJ, para a música e as experiências coletivas; e a Árvore, com uma grande copa que dá sombra e uma estrutura central que coleta a água da chuva e a leva à vegetação. O grupo partiu de maquetes físicas e usou a IA para gerar renders e vídeo, testando atmosfera, escala, materiais, vegetação e momentos de uso, do dia calmo à noite musical, e deu à IA referências visuais de marcas e identidades gráficas existentes. Uma prancha técnica reúne as quatro estruturas.",en:"A family of modular structures in timber and fabric, inspired by Asian minimalist construction (lightweight structures, bamboo-like wood, fabric) and adapted to a Brazilian cultural identity: the Agora, a place of conviviality, culture and creativity that gives the avenue back to its people, inspired by the Greek agora; the Kiosk, which hosts food, books or events; the DJ Stage, for music and collective experiences; and the Tree, with a large canopy that gives shade and a central structure that collects rainwater and leads it to the planting. The group started from physical models and used AI to generate renders and video, testing atmosphere, scale, materials, planting and moments of use, from the quiet day to the musical night, and gave AI visual references from existing brands and graphic identities. A technical sheet gathers the four structures.",fr:"Une famille de structures modulaires en bois et tissu, inspirée de la construction minimaliste asiatique (structures légères, bois de type bambou, tissu) et adaptée à une identité culturelle brésilienne : l’Agora, lieu de convivialité, de culture et de créativité qui rend l’avenue à ses habitants, inspirée de l’agora grecque ; le Kiosque, qui accueille nourriture, livres ou événements ; la Scène DJ, pour la musique et les expériences collectives ; et l’Arbre, avec une grande canopée qui donne de l’ombre et une structure centrale qui recueille l’eau de pluie et la dirige vers la végétation. Le groupe est parti de maquettes physiques et a utilisé l’IA pour générer rendus et vidéo, testant atmosphère, échelle, matériaux, végétation et moments d’usage, du jour calme à la nuit musicale, et a donné à l’IA des références visuelles de marques et d’identités graphiques existantes. Une planche technique réunit les quatre structures.",zh:"一个由木材与织物制成的模块化结构系列，灵感来自亚洲的极简建筑（轻质结构、类似竹的木材、织物），并适应了巴西的文化身份：广场（Agora），一个用来聚会、文化和创造的地方，把大道还给人们，灵感来自希腊的广场；售货亭，可容纳食物、书籍或活动；DJ 舞台，用于音乐和集体体验；还有树，带有可遮荫的大顶篷，中央结构收集雨水并引向植物。小组从实体模型出发，用人工智能生成渲染图和视频，测试氛围、尺度、材料、植物和使用时刻，从平静的白天到有音乐的夜晚，并向人工智能提供现有品牌与图形识别的视觉参考。一张技术图版汇总了这四个结构。"},
  diff:{pt:"É o ensaio em que a IA mais volta à matéria: tudo parte de maquetes físicas, e os renders testam o que a maquete já sugere. Funciona como sistema, e não como objeto isolado: quatro estruturas com a mesma linguagem de material e usos diferentes (conviver, comer e ler, dançar, abrigar), de dia e de noite. Falta mostrar como o conjunto seria gerido e programado.",en:"The essay in which AI returns most to matter: everything starts from physical models, and the renders test what the model already suggests. It works as a system, not as an isolated object: four structures with the same material language and different uses (gathering, eating and reading, dancing, sheltering), by day and by night. What is missing is how the set would be managed and programmed.",fr:"L’essai où l’IA revient le plus à la matière : tout part de maquettes physiques, et les rendus testent ce que la maquette suggère déjà. Il fonctionne comme un système, non comme un objet isolé : quatre structures au même langage de matériau et aux usages différents (se réunir, manger et lire, danser, abriter), de jour comme de nuit. Il manque de montrer comment l’ensemble serait géré et programmé.",zh:"人工智能最多回到物质的作品：一切从实体模型出发，渲染图只是检验模型已经暗示的东西。它是一个系统，而不是孤立的物件：四个结构，材料语言相同，用途不同（聚会、吃饭与阅读、跳舞、遮蔽），白天和夜晚皆可。缺少的是如何管理和安排这套系统。"},

function wrapSub(t){
  const cjk=/[\u4e00-\u9fff]/.test(t); const max=cjk?15:27;
  if(t.length<=max)return [t];
  const mid=t.length/2; let best=-1,bd=1e9;
  for(let i=0;i<t.length;i++){ if((t[i]===','&&t[i+1]===' ')||t[i]==='、'){const d=Math.abs(i-mid);if(d<bd){bd=d;best=i}} }

  const a=t.slice(0,best+1).trim(), b=t.slice(best+(t[best]===','?2:1)).trim(); return [a,b];

function spiderSVG(list){

  for(let k=1;k<=5;k++){const pts=[...Array(n)].map((_,i)=>polar(cx,cy,R*k/5,i*60).join(',')).join(' ');s+=`<polygon points="${pts}" fill="${k===5?'#f6f6f6':'none'}" stroke="#d6d6d6" stroke-width="${k===5?1.6:1}"/>`;
    s+=`<text x="${cx+4}" y="${cy-R*k/5+12}" font-size="10" fill="#9a9a9a">${k}</text>`}
  [...Array(n)].forEach((_,i)=>{const[x,y]=polar(cx,cy,R,i*60);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#d6d6d6"/>`});
  const vis=list.filter(p=>!S.spOff.has(p.id));
  vis.slice().sort((a,b)=>(a.id===S.spSel)-(b.id===S.spSel)).forEach(p=>{const sel=p.id===S.spSel;
    const pts=p.scores.map((v,i)=>polar(cx,cy,R*v/5,i*60));

  s+='<g class="ax">'+UI.axes.map((a,i)=>{const[x,y]=polar(cx,cy,R+30,i*60);const anc=Math.abs(x-cx)<8?'middle':x>cx?'start':'end';const on=S.spAxis===a.k;

  return s;
}

function autoSVG(r){
  const X=v=>12+(v-1)/4*196; let s='<svg viewBox="0 0 220 44" role="img">';
  s+='<line x1="12" y1="18" x2="208" y2="18" stroke="#BDBDBD" stroke-width="2"/>';
  [1,2,3,4,5].forEach(v=>s+=`<line x1="${X(v)}" y1="13" x2="${X(v)}" y2="23" stroke="#BDBDBD" stroke-width="2"/><text x="${X(v)}" y="40" text-anchor="middle" font-size="11" fill="#6F6F6F">${v}</text>`);
  r.forEach(([v,amb,g])=>s+=`<circle cx="${X(v)}" cy="18" r="8" fill="${amb?'#fff':'#1E8F4E'}" stroke="#1E8F4E" stroke-width="3"><title>${g} · ${v}</title></circle>`);
  return s+'</svg>';
}

function hueAgg(t){const a=Array(12).fill(0);PROJ.filter(p=>p.tema===t).forEach(p=>PAL[p.pal].hue.forEach((v,i)=>a[i]+=v));return a}
function wheelSVG(){
  const cx=350,cy=350; let s=`<svg viewBox="0 0 700 700" role="img" aria-label="${esc(L(UI.s4.col_h))}">`;
  for(let h=0;h<360;h+=3){const[x0,y0]=polar(cx,cy,196,h),[x1,y1]=polar(cx,cy,196,h+3.4),[x2,y2]=polar(cx,cy,212,h+3.4),[x3,y3]=polar(cx,cy,212,h);
    s+=`<path d="M${x0},${y0} L${x1},${y1} L${x2},${y2} L${x3},${y3} Z" fill="hsl(${h},75%,52%)"/>`}
  [0.3,0.6,0.9].forEach(k=>s+=`<circle cx="${cx}" cy="${cy}" r="${40+k*160}" fill="none" stroke="#cfd8d2" stroke-dasharray="3 5"/>`);
  [0,90,180,270].forEach(h=>{const[x,y]=polar(cx,cy,196,h),[x2,y2]=polar(cx,cy,30,h);s+=`<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#cfd8d2"/>`;const[tx,ty]=polar(cx,cy,176,h);s+=`<text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="11" fill="#7a8a80">${h}°</text>`});
  const mx=Math.max(...['A','B','C'].flatMap(t=>hueAgg(t)));
  ['A','B','C'].forEach((t,ti)=>{const base=224+ti*34; const on=S.pal==='all'||S.pal===t; const ag=hueAgg(t);
    ag.forEach((v,i)=>{const a0=i*30+2,a1=i*30+28;const len=Math.max(1.5,v/mx*30);const[p0x,p0y]=polar(cx,cy,base,a0),[p1x,p1y]=polar(cx,cy,base,a1),[p2x,p2y]=polar(cx,cy,base+len,a1),[p3x,p3y]=polar(cx,cy,base+len,a0);
      s+=`<path d="M${p0x},${p0y} A${base},${base} 0 0 1 ${p1x},${p1y} L${p2x},${p2y} A${base+len},${base+len} 0 0 0 ${p3x},${p3y} Z" fill="${TCOL[t]}" opacity="${on?1:.12}"/>`});
    const[lx,ly]=polar(cx,cy,base+15,0);s+=`<text x="${lx+8}" y="${ly+4}" font-size="11" font-weight="700" fill="${TCOL[t]}" opacity="${on?1:.3}">${t}</text>`});
  PROJ.forEach(p=>{const on=S.pal==='all'||S.pal===p.tema; PAL[p.pal].colors.forEach(c=>{const[x,y]=polar(cx,cy,40+c.s*160,c.h);const r=Math.min(30,4+Math.sqrt(c.w)*70);
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${c.hex}" fill-opacity="${on?.9:.08}" stroke="#fff" stroke-width="${on?1.5:0}"><title>${code(p)} · ${c.hex}</title></circle>`})});
  return s+'</svg>';
}
function palRows(){
  return PROJ.filter(p=>S.pal==='all'||S.pal===p.tema).map(p=>{const P=PAL[p.pal];const nw=P.neutral/3;
    const st=P.neu.map(c=>`<i style="width:${nw*100}%;background:${c}"></i>`).join('')+P.colors.map(c=>`<i style="width:${c.w*100}%;background:${c.hex}"></i>`).join('');
    return `<div class="pal"><span class="nm"><i style="background:${p.col}"></i>${code(p)}</span><div class="st">${st}</div><small>${Math.round(P.neutral*100)}%</small></div>`}).join('');
}

}

async function doDownload(){

  if(!REPORT.b64)return;
  try{const bin=atob(REPORT.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);

}
