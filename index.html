<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nantes Brazil Design Studio - AI LAB · Paulista 24/7</title>
<meta name="description" content="Mackenzie × L’École de design Nantes Atlantique — o que muda no modelo de criação quando a IA se torna parte do processo?">
<style>:root{
  --green:#1E8F4E; --green-d:#166B3B; --green-m:#5DAE7A; --mint:#E7F2EA;
  --char:#3D3D3D; --ink:#1B1B1B; --gray:#6F6F6F; --silver:#BDBDBD; --pale:#EDEDED; --line:#E4E4E4; --white:#fff;
  --bg:#fff; --fg:#1B1B1B; --muted:#6F6F6F; --surface:#EDEDED;
  --tA:#5DAE7A; --tB:#166B3B; --tC:#3D3D3D;
  --hdr:68px;
  --font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#fff;--fg:#1B1B1B}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:auto}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{width:min(1280px,100% - 48px);margin-inline:auto}
.hide-sm{display:initial}

/* ---------- header ---------- */
.hdr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--hdr);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);z-index:50;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:rgba(255,255,255,.96);z-index:51}
.hdr .wrap{display:flex;align-items:center;height:100%;gap:28px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.logo img{height:40px;width:auto}
.logo span{font-size:11px;line-height:1.2;font-weight:700;letter-spacing:.06em;border-left:2px solid var(--ink);padding-left:12px}
.logo span i{display:block;font-weight:400;font-style:italic;color:var(--gray);letter-spacing:0}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{font-size:13px;font-weight:700;text-decoration:none;padding:8px 11px;border-radius:2px;color:var(--ink);white-space:nowrap}
.nav a:hover,.nav a.on{background:var(--green);color:#fff}
.lang{display:flex;border:1px solid var(--ink);margin-left:10px}
.lang button{padding:6px 9px;font-size:12px;font-weight:700;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.burger{display:none;margin-left:auto;width:44px;height:44px;font-size:24px}

/* ---------- hero carousel ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;background:#111;color:#fff;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.slide.on .media{animation:kb 11s ease-out forwards}
.slide:nth-child(even).on .media{animation-name:kb2}
@keyframes kb{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-1.6%,-1%,0)}}
@keyframes kb2{from{transform:scale(1.14) translate3d(1.4%,0,0)}to{transform:scale(1.02) translate3d(0,0,0)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.82) 100%);pointer-events:none}
.rings{position:absolute;right:-9vw;top:50%;width:min(62vw,820px);aspect-ratio:1;transform:translateY(-46%);z-index:2;pointer-events:none}
.rings circle{fill:none}
.hero-txt{position:absolute;left:0;right:0;bottom:0;z-index:3;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.hero-txt .meta{font-size:14px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green);flex:none}
.hero h1{font-size:clamp(44px,10.5vw,170px);line-height:.9;letter-spacing:-.05em;font-weight:700;margin-left:-.04em}
.hero .sub{font-size:clamp(18px,2.2vw,30px);margin-top:20px;max-width:30ch;line-height:1.2}
.hero .ask{margin-top:14px;font-size:clamp(14px,1.3vw,18px);font-style:italic;opacity:.9;max-width:52ch}
.hero-ctrl{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:4}
.hero-ctrl .wrap{display:flex;align-items:center;gap:18px}
.segs{display:flex;gap:6px;flex:1}
.seg{flex:1;height:34px;display:flex;align-items:center}
.seg i{display:block;width:100%;height:3px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.seg i::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.seg.done i::after{transform:scaleX(1)}
.seg.on i::after{animation:fill var(--dur,7s) linear forwards}
.hero.paused .seg.on i::after{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.cap{font-size:13px;min-width:200px;text-align:right}
.cap b{display:block;font-size:15px}
.pp{width:40px;height:40px;border:1.5px solid #fff;border-radius:50%;font-size:14px;flex:none}
.pp:hover{background:#fff;color:#111}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;background:var(--green);color:#fff;margin-right:8px;vertical-align:middle}

/* ---------- sections ---------- */
section.s{padding:clamp(72px,10vw,140px) 0;position:relative}
.s.dark{background:var(--char);color:#fff}
.s.green{background:var(--green-d);color:#fff}
.s.mint{background:var(--mint)}
.s.gray{background:var(--pale)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:18px}
.dark .eyebrow,.green .eyebrow{color:#fff}
.green .dot,.dark .dot{background:var(--green-m)}
h2.big{font-size:clamp(40px,7vw,104px);line-height:.95;letter-spacing:-.045em;font-weight:700;max-width:16ch}
h2.mid{font-size:clamp(28px,3.6vw,52px);line-height:1.02;letter-spacing:-.035em;font-weight:700;max-width:22ch}
h3{font-size:clamp(22px,2.2vw,30px);line-height:1.1;letter-spacing:-.02em;font-weight:700}
h4{font-size:16px;font-weight:700;letter-spacing:-.005em}
p.lead{font-size:clamp(18px,1.7vw,24px);line-height:1.38;max-width:44ch;margin-top:26px}
p.txt{max-width:62ch;color:var(--muted);font-size:17px;line-height:1.55}
.dark p.txt,.green p.txt{color:rgba(255,255,255,.78)}
.sec-head{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:clamp(40px,5vw,72px)}
.sub-h{margin:clamp(56px,7vw,100px) 0 28px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-top:3px solid var(--ink);padding-top:16px}
.dark .sub-h,.green .sub-h{border-color:#fff}
.sub-h h3{flex:1;min-width:240px}
.sub-h small{font-size:13px;color:var(--muted);max-width:50ch}
.dark .sub-h small,.green .sub-h small{color:rgba(255,255,255,.7)}
.note{font-size:13px;color:var(--muted);margin-top:12px;max-width:70ch;line-height:1.45}
.dark .note,.green .note{color:rgba(255,255,255,.65)}
.note::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;margin-right:8px;vertical-align:0}

.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

/* question band */
.qband{background:var(--green);color:#fff;padding:clamp(56px,8vw,110px) 0;position:relative;overflow:hidden}
.qband h2{font-size:clamp(34px,6vw,92px);line-height:1;letter-spacing:-.045em;font-weight:700;max-width:19ch;position:relative;z-index:1}
.qband svg{position:absolute;right:-8vw;top:50%;transform:translateY(-50%);width:min(52vw,640px);opacity:.9}
.qband .eyebrow{color:#fff;position:relative;z-index:1}
.qband .dot{background:#fff}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:3px solid currentColor}
.kpi{padding:22px 18px 22px 0}
.kpi b{display:block;font-size:clamp(54px,7vw,104px);line-height:.9;letter-spacing:-.05em;color:var(--green)}
.dark .kpi b,.green .kpi b{color:#fff}
.kpi span{display:block;margin-top:10px;font-size:14px;max-width:20ch;line-height:1.3}

/* objectives */
.objs{list-style:none;margin-top:24px;counter-reset:o}
.objs li{padding:16px 0;border-top:1px solid var(--line);font-size:17px;display:flex;gap:16px;max-width:60ch}
.objs li::before{content:counter(o);counter-increment:o;font-weight:700;color:var(--green);flex:none;width:20px}

/* universe dots */
.uni{display:grid;grid-template-columns:auto repeat(4,1fr);gap:8px;align-items:center;max-width:520px;margin-top:20px}
.uni .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.uni .row{font-weight:700;font-size:15px}
.uni .g{height:42px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}

/* rq cards */
.rq{border:2px solid var(--pale);padding:28px 26px 30px;background:#fff;display:flex;flex-direction:column;gap:10px;min-height:260px}
.rq b.n{font-size:56px;line-height:1;letter-spacing:-.04em;color:var(--green)}
.rq h4{letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.rq p{color:var(--muted);margin-top:auto}

/* method */
.method{display:grid;grid-template-columns:1fr;gap:clamp(28px,4vw,60px)}
.bbsq{display:grid;grid-template-columns:repeat(2,minmax(0,440px));gap:clamp(20px,4vw,56px);justify-content:center;margin-top:8px}
.bbcards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
.bbc{background:#fff;border-top:6px solid;padding:16px 18px 20px}
.bbc em{display:block;font-size:13px;color:var(--muted);margin:2px 0 8px}
.bbc p{font-size:14px;line-height:1.4;color:var(--ink)}
@media (max-width:960px){.bbcards{grid-template-columns:1fr 1fr}.bbsq{grid-template-columns:1fr}}
@media (max-width:560px){.bbcards{grid-template-columns:1fr}}
.mbox{background:var(--pale);padding:28px;position:relative}
.mbox h3{margin-bottom:6px}
.mbox .src{font-size:12px;color:var(--muted);font-style:italic}
.mbox svg{width:100%;height:auto;margin-top:12px;overflow:visible}
.mdetail{min-height:92px;margin-top:10px;font-size:15px;line-height:1.45;border-left:4px solid var(--green);padding-left:14px}
.mdetail b{display:block;font-size:17px;margin-bottom:2px}
.qd{cursor:pointer;transition:opacity .2s}
.qd:hover{opacity:.82}

/* process */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:3px solid var(--ink)}
.enc{padding:20px 18px 24px 0;position:relative}
.enc .d{font-weight:700;color:var(--green);font-size:20px;margin-top:6px}
.enc .nm{font-size:clamp(34px,4vw,56px);font-weight:700;color:var(--silver);letter-spacing:-.04em;line-height:1}
.enc h4{margin-top:14px;font-size:20px}
.enc p{color:var(--muted);margin-top:8px;font-size:15px;max-width:26ch}
.enc em{display:block;margin-top:14px;font-style:normal;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--green);text-transform:uppercase}
.enc.last{border-top:6px solid var(--green);margin-top:-4.5px}
.diary{margin-top:34px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.diary div{background:var(--mint);padding:18px;font-size:15px;line-height:1.35}
.diary b{display:block;font-size:30px;color:var(--green);line-height:1;margin-bottom:8px}

/* rhythms */
.rhy{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.rhy div{padding:24px 22px 28px;min-height:180px}
.rhy b{display:block;font-size:20px;letter-spacing:.06em;margin-bottom:34px}
.rhy p{font-size:15px;line-height:1.4}
.rhy2{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:0}
.rhy2 div{background:var(--pale);padding:20px 22px}
.rhy2 b{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rhy2 p{font-size:14px;color:var(--muted)}
blockquote{font-size:clamp(22px,2.6vw,36px);line-height:1.22;letter-spacing:-.02em;font-style:italic;max-width:34ch;padding-left:26px;border-left:8px solid var(--green)}

/* challenges */
.chal{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px}
.chal>div{padding:26px 26px 30px 0}
.chal .l{width:62px;height:62px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;font-weight:700;display:grid;place-items:center;margin-bottom:22px}
.chal .o{font-size:12px;letter-spacing:.12em;color:var(--green);font-weight:700;text-transform:uppercase;margin:6px 0 14px}
.chal p{color:var(--muted)}

/* criteria */
.crit{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.crit>div{padding:26px 24px 30px 0;border-top:1px solid var(--line)}
.crit h4{display:flex;gap:10px;align-items:center;font-size:22px;letter-spacing:-.02em}
.crit p{margin-top:12px;color:var(--muted);max-width:30ch}

/* ---------- data ---------- */
.chart{margin-top:22px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.card{background:rgba(255,255,255,.07);padding:26px}
.light-card{background:var(--pale);padding:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;font-size:14px;font-weight:700;border:2px solid #fff}
.chip small{font-weight:400;font-size:12px;opacity:.85}
.chip.pl{background:var(--green-m);border-color:var(--green-m);color:#0d2a18}
.chip.ex{background:transparent;border-color:#fff;color:#fff}
.chip.no{border-style:dashed;border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.55);font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:16px;color:rgba(255,255,255,.8)}
.legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tbar{margin-top:10px}
.tbar .r{display:grid;grid-template-columns:64px 1fr 30px;align-items:center;gap:10px;font-size:14px;margin:8px 0}
.tbar .r i{display:block;height:20px}
.big-n{font-size:clamp(56px,6vw,88px);font-weight:700;letter-spacing:-.05em;line-height:.9}

/* ---------- essays ---------- */
.tabs{display:flex;gap:0;border-bottom:3px solid var(--ink);position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));background:#fff;z-index:20;margin-top:40px;flex-wrap:wrap}
.tab{flex:1;min-width:150px;text-align:left;padding:16px 18px 14px;border-right:1px solid var(--line);transition:background .2s,color .2s}
.tab b{display:block;font-size:30px;line-height:1;letter-spacing:-.03em}
.tab span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.8}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab[aria-selected="true"][data-t="A"]{background:var(--tA);color:#0b2616}
.tab[aria-selected="true"][data-t="B"]{background:var(--tB)}
.tab[aria-selected="true"][data-t="C"]{background:var(--tC)}
.bu{position:relative;margin:30px 0 0}
.bu svg{width:100%;height:auto;max-height:340px;display:block}
.tema-head{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,60px);align-items:end;padding:48px 0 32px}
.tema-head .L{font-size:clamp(120px,20vw,280px);line-height:.72;font-weight:700;letter-spacing:-.07em}
.tema-head h3{font-size:clamp(30px,4vw,56px);letter-spacing:-.04em}
.tema-head .ord{font-size:12px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--green);margin:8px 0 14px}
.proj{display:grid;grid-template-columns:minmax(260px,.8fr) 1.6fr;gap:clamp(24px,4vw,60px);padding:48px 0;border-top:1px solid var(--line)}
.proj .info{position:sticky;top:calc(var(--hdr) + 110px);align-self:start}
.proj .pn{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin-bottom:10px}
.proj .pn i{width:14px;height:14px;display:block}
.proj h3{font-size:clamp(28px,3vw,42px);letter-spacing:-.035em}
.proj p{margin-top:14px;color:var(--muted);font-size:16px;max-width:42ch}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;background:var(--pale)}
.badge.v{background:var(--ink);color:#fff}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;grid-auto-flow:dense}
.gal button{position:relative;background:var(--pale);overflow:hidden;display:block;aspect-ratio:4/3;text-align:left}
.gal button:nth-child(1){grid-column:span 4;grid-row:span 2;aspect-ratio:auto;min-height:340px}
.gal button.tall{aspect-ratio:3/4}
.gal button img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal button:hover img{transform:scale(1.04)}
.gal button:nth-child(n+2){grid-column:span 2}
.gal button .k{position:absolute;left:0;bottom:0;background:#fff;font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.04em}
.gal button.poster img{object-fit:contain;background:#f4f4f4}
.blk{background:var(--mint);margin-top:48px;padding:clamp(28px,4vw,56px)}
.blk h3{margin-bottom:22px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:26px}
.ins p{font-size:16px;line-height:1.45;border-top:3px solid var(--green);padding-top:12px}
.stat{display:flex;gap:30px;flex-wrap:wrap}
.stat div b{display:block;font-size:48px;line-height:1;letter-spacing:-.04em;color:var(--green)}
.stat div span{font-size:13px;max-width:18ch;display:block;margin-top:4px;color:var(--ink)}
.spider{display:grid;grid-template-columns:minmax(300px,1.1fr) 1fr;gap:clamp(24px,4vw,60px);align-items:start;margin-top:30px}
.spider svg{width:100%;height:auto;overflow:visible;max-width:640px;margin-inline:auto}
.sp-leg{display:flex;flex-direction:column;gap:6px}
.sp-leg .sl{display:flex;gap:6px}
.sp-leg .sl>button:first-child{flex:1;display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700}
.sp-leg .sl>button:first-child i{width:16px;height:16px;flex:none}
.sp-leg .sl>button[aria-pressed="true"]:first-child{border-color:var(--ink)}
.sp-leg .sl .tg{width:46px;border:2px solid var(--line);background:#fff;font-size:16px}
.sp-leg .sl.off>button:first-child{opacity:.38}
.sp-detail{margin-top:16px;background:var(--ink);color:#fff;padding:22px;min-height:150px}
.sp-detail h4{font-size:20px;margin-bottom:6px}
.sp-detail p{font-size:15px;line-height:1.45;color:rgba(255,255,255,.85)}
.sp-detail .rk{display:grid;grid-template-columns:1fr 100px 28px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.sp-detail .rk i{display:block;height:10px;background:#fff;transform-origin:left}
.mode{display:flex;gap:0;margin-top:26px}
.mode button{padding:9px 16px;font-size:13px;font-weight:700;border:2px solid var(--ink)}
.mode button+button{border-left:0}
.mode button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ax text{cursor:pointer}
.ax text:hover{fill:var(--green)}

/* ---------- aesthetics ---------- */
.wheel-wrap{display:grid;grid-template-columns:minmax(320px,1fr) 1fr;gap:clamp(24px,5vw,80px);align-items:center}
.wheel-wrap svg{width:100%;max-width:640px;margin-inline:auto;overflow:visible}
.pill{padding:8px 14px;border:2px solid var(--ink);font-weight:700;font-size:13px}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,48px)}

  case_q:{pt:'A Paulista tem uma vida diurna definida (corporativa, comercial, financeira), mas sua vida noturna e de fim de semana é fragmentada. E se a avenida fosse vista como um dos principais eixos artístico-culturais latinos, tornando-se um roteiro obrigatório para o mundo?',en:'Paulista has a well-defined daytime life (corporate, commercial, financial), but its night and weekend life is fragmented. What if the avenue were seen as one of the main Latin artistic and cultural axes, becoming a must-visit for the world?',fr:'La Paulista a une vie diurne bien définie (entreprises, commerce, finance), mais sa vie nocturne et de week-end est fragmentée. Et si l’avenue était vue comme l’un des grands axes artistiques et culturels latins, un passage obligé pour le monde ?',zh:"保利斯塔大道的白天生活清晰明确（企业、商业、金融），但夜晚和周末的生活却是零散的。如果把这条大道看作拉丁美洲最重要的艺术与文化轴线之一，成为世界必访之地，会怎样？"},

  {k:'aca',n:{pt:'Acabamento',en:'Finish',fr:'Finition',zh:"完成度"},q:{pt:'A execução é coerente com o que o grupo se propôs a entregar?',en:'Is the execution consistent with what the group set out to deliver?',fr:'L’exécution est-elle cohérente avec ce que le groupe s’était proposé de livrer ?',zh:"执行是否与小组承诺交付的内容相符？"}},
  {k:'poe',n:{pt:'Poética',en:'Poetics',fr:'Poétique',zh:"诗意"},q:{pt:'A linguagem comunica algo além da função?',en:'Does the language communicate something beyond function?',fr:'Le langage communique-t-il quelque chose au-delà de la fonction ?',zh:"语言是否传达了功能之外的东西？"}},
  {k:'rel',n:{pt:'Relevância',en:'Relevance',fr:'Pertinence',zh:"相关性"},q:{pt:'Responde de fato ao desafio da Paulista 24/7, referência para o mundo?',en:'Does it really answer the challenge of Paulista 24/7 as a world reference?',fr:'Répond-il vraiment au défi de la Paulista 24/7, référence mondiale ?',zh:"它是否真正回应了“保利斯塔大道 24/7，世界级参照”这一挑战？"}},
  {k:'fac',n:{pt:'Factibilidade',en:'Feasibility',fr:'Faisabilité',zh:"可行性"},q:{pt:'É defensável como algo que poderia sair do papel?',en:'Is it defensible as something that could leave the paper?',fr:'Est-ce défendable comme quelque chose qui pourrait sortir du papier ?',zh:"它能否被论证为可以走出图纸的方案？"}},
  {k:'ia',n:{pt:'Uso crítico da IA',en:'Critical use of AI',fr:'Usage critique de l’IA',zh:"对人工智能的批判性使用"},q:{pt:'A IA foi utilizada até qual limite? Foi ferramenta, parceira e/ou condutora?',en:'To what limit was AI used? Was it a tool, a partner and/or a driver?',fr:'Jusqu’à quelle limite l’IA a-t-elle été utilisée ? Outil, partenaire et/ou conductrice ?',zh:"人工智能被用到了什么程度？它是工具、伙伴，还是主导者？"}}],

 s2:{

  title:{pt:'Como a turma usou a IA',en:'How the class used AI',fr:'Comment la classe a utilisé l’IA',zh:"班级如何使用人工智能"},
  scope:{pt:'Base desta versão: diários de bordo em áudio (aulas 1 e 2) dos 6 grupos da turma da tarde, mais o registro de prompts de um grupo do Tema A. Quando o relatório geral das 12 equipes e das aulas 3–4 chegar, os gráficos são atualizados no mesmo formato.',en:'Basis of this version: audio logbooks (classes 1 and 2) of the 6 afternoon groups, plus one Theme A group’s prompt record. When the overall report for all 12 teams and classes 3–4 arrives, the charts update in the same format.',fr:'Base de cette version : journaux audio (cours 1 et 2) des 6 groupes de l’après-midi, plus le registre de prompts d’un groupe du Thème A. Quand le rapport général des 12 équipes et des cours 3–4 arrivera, les graphiques seront mis à jour au même format.',zh:"本版依据：下午 6 个小组的音频日志（第 1、2 次课），以及主题 A 一个小组的提示词记录。当全部 12 个小组以及第 3、4 次课的总报告到位后，图表将以相同格式更新。"},

       {n:'5 / 6',l:{pt:'grupos começaram por um método próprio antes da IA',en:'groups started with their own method before AI',fr:'groupes ont commencé par leur propre méthode avant l’IA',zh:"个小组在使用人工智能之前先建立了自己的方法"}},
       {n:'3,7',l:{pt:'média de autonomia declarada (1–5) na aula 1',en:'average declared autonomy (1–5) in class 1',fr:'moyenne d’autonomie déclarée (1–5) au cours 1',zh:"第 1 次课声明的平均自主度（1–5）"}},

  tools_h:{pt:'Ferramentas: o que foi sugerido × o que os alunos usaram',en:'Tools: what was suggested × what students used',fr:'Outils : suggérés × réellement utilisés',zh:"工具：建议的 × 学生实际使用的"},
  tools_s:{pt:'O número em cada ficha indica quantos grupos (de 6 na aula 1; de 5 na aula 2) citaram a ferramenta.',en:'The number on each chip shows how many groups (of 6 in class 1; of 5 in class 2) named the tool.',fr:'Le chiffre sur chaque pastille indique combien de groupes (sur 6 au cours 1 ; sur 5 au cours 2) ont cité l’outil.',zh:"每个标签上的数字表示有多少个小组（第 1 次课共 6 组，第 2 次课共 5 组）提到了该工具。"},
  ctx:{pt:'Contexto',en:'Context',fr:'Contexte',zh:"情境"},ins:{pt:'Insights',en:'Insights',fr:'Insights',zh:"洞察"},
  lg_pl:{pt:'Sugerida e usada',en:'Suggested and used',fr:'Suggéré et utilisé',zh:"建议并使用"},lg_ex:{pt:'Trazida pelos alunos',en:'Brought by students',fr:'Apportée par les étudiants',zh:"学生自带"},lg_no:{pt:'Sugerida, não citada',en:'Suggested, not named',fr:'Suggéré, non cité',zh:"建议但未提及"},
  tools_ins:{pt:'Leitura: os alunos ampliaram a lista com IAs de pesquisa acadêmica (Elicit), de síntese (Dovetail) e de outras origens geopolíticas (Qwen, Mistral). Miro AI e DeepSeek não apareceram.',en:'Reading: students widened the list with academic-research AIs (Elicit), synthesis AIs (Dovetail) and tools of other geopolitical origins (Qwen, Mistral). Miro AI and DeepSeek did not appear.',fr:'Lecture : les étudiants ont élargi la liste avec des IA de recherche académique (Elicit), de synthèse (Dovetail) et d’autres origines géopolitiques (Qwen, Mistral). Miro AI et DeepSeek n’ont pas été cités.',zh:"解读：学生在清单之外加入了学术研究类人工智能（Elicit）、综合类人工智能（Dovetail）以及来自其他地缘背景的工具（Qwen、Mistral）。Miro AI 和 DeepSeek 没有出现。"},
  div_h:{pt:'Diversidade de ferramentas por grupo',en:'Tool diversity per group',fr:'Diversité d’outils par groupe',zh:"各小组的工具多样性"},
  div_s:{pt:'Nº de IAs citadas em cada aula. O Tema B (símbolos e interações) foi o mais plural: 10 IAs distintas, contra 5 no Tema A e 6 no C.',en:'Number of AIs named in each class. Theme B (symbols & interactions) was the most plural: 10 distinct AIs versus 5 in Theme A and 6 in C.',fr:'Nombre d’IA citées à chaque cours. Le Thème B (symboles et interactions) a été le plus varié : 10 IA distinctes contre 5 au Thème A et 6 au C.',zh:"每次课中提到的人工智能数量。主题 B（符号与互动）最为多元：共 10 种不同的人工智能，主题 A 为 5 种，主题 C 为 6 种。"},
  aut_h:{pt:'Autonomia declarada: quanto da decisão foi do grupo (1–5)',en:'Declared autonomy: how much of the decision was the group’s (1–5)',fr:'Autonomie déclarée : part de la décision revenant au groupe (1–5)',zh:"声明的自主度：决定中有多少属于小组（1–5）"},
  aut_s:{pt:'Ponto vazado = nota dita de forma ambígua no áudio. Grupos sem nota explícita ficam fora.',en:'Hollow dot = grade stated ambiguously in the audio. Groups without an explicit grade are left out.',fr:'Point creux = note formulée de façon ambiguë dans l’audio. Les groupes sans note explicite sont exclus.',zh:"空心圆点 = 音频中给出的评分含糊。没有明确评分的小组不计入。"},
  str_h:{pt:'Estratégias de uso crítico observadas',en:'Critical-use strategies observed',fr:'Stratégies d’usage critique observées',zh:"观察到的批判性使用策略"},
  str_s:{pt:'Nº de grupos (de 6) que relataram este tipo de comportamento nas aulas 1 (contexto) e 2 (insights). Codificação feita sobre as transcrições.',en:'Number of groups (of 6) reporting this kind of behaviour in classes 1 (context) and 2 (insights). Coding done on the transcripts.',fr:'Nombre de groupes (sur 6) rapportant ce type de comportement aux cours 1 (contexte) et 2 (insights). Codage fait sur les transcriptions.',zh:"在第 1 次课（情境）和第 2 次课（洞察）中报告这类行为的小组数（共 6 组）。依据转录文本编码。"},
  str:[{pt:'Método próprio antes da IA',en:'Own method before AI',fr:'Méthode propre avant l’IA',zh:"在使用人工智能之前先有自己的方法",v:5},{pt:'Validação com fontes externas',en:'Validation with outside sources',fr:'Validation par des sources externes',zh:"用外部资料来源验证",v:4},{pt:'Triangulação entre várias IAs',en:'Triangulating several AIs',fr:'Triangulation entre plusieurs IA',zh:"对多个人工智能做三角验证",v:4},{pt:'Descarte de soluções prematuras',en:'Discarding premature solutions',fr:'Rejet de solutions prématurées',zh:"舍弃过早的方案",v:4},{pt:'Reescrita de perguntas e prompts',en:'Rewriting questions and prompts',fr:'Réécriture de questions et prompts',zh:"改写问题与提示词",v:3},{pt:'Volta a uma etapa anterior',en:'Going back to an earlier stage',fr:'Retour à une étape antérieure',zh:"退回到较早的阶段",v:2}],
  thr_h:{pt:'Prompt Threads: 16 iterações de um grupo do Tema A',en:'Prompt Threads: 16 iterations of one Theme A group',fr:'Prompt Threads : 16 itérations d’un groupe du Thème A',zh:"提示词记录：主题 A 一个小组的 16 次迭代"},
  thr_s:{pt:'O registro de “prompt threads” mostra a curadoria acontecendo: só 3 das 16 iterações viraram direção ou resultado; as demais foram mantidas como princípio, revisadas ou rejeitadas.',en:'The “prompt threads” record shows curation happening: only 3 of 16 iterations became direction or outcome; the rest were kept as principle, revised or rejected.',fr:'Le registre des « prompt threads » montre la curation à l’œuvre : seules 3 itérations sur 16 sont devenues direction ou résultat ; les autres ont été gardées comme principe, révisées ou rejetées.',zh:"“提示词记录”显示出筛选在发生：16 次迭代中只有 3 次成为方向或成果，其余的被保留为原则、被修改或被否决。"},

  voices_h:{pt:'Cada IA tem um “sotaque”',en:'Each AI has an “accent”',fr:'Chaque IA a un « accent »',zh:"每个人工智能都有自己的“口音”"},
  voices_s:{pt:'Um grupo do Tema B comparou as respostas de seis IAs à mesma pergunta e notou vieses de origem:',en:'A Theme B group compared six AIs’ answers to the same question and noticed origin-related biases:',fr:'Un groupe du Thème B a comparé les réponses de six IA à la même question et noté des biais d’origine :',zh:"一个主题 B 的小组把六个人工智能对同一问题的回答作了比较，并注意到与来源有关的偏向："},
  voices:[{a:'Kimi · Qwen',t:{pt:'Visão global e de futuro: urbanismo, desenvolvimento, sustentabilidade; diagnóstico sociológico e tensões estruturais.',en:'Global, future-oriented view: urbanism, development, sustainability; sociological diagnosis and structural tensions.',fr:'Vision globale et tournée vers l’avenir : urbanisme, développement, durabilité ; diagnostic sociologique et tensions structurelles.',zh:"全球化、面向未来的视角：城市规划、发展、可持续性；社会学诊断与结构性张力。"}},

          {a:'Claude',t:{pt:'Foco em governança e na ideia de um ambiente digital hiperconectado.',en:'Focus on governance and the idea of a hyper-connected digital environment.',fr:'Accent sur la gouvernance et l’idée d’un environnement numérique hyperconnecté.',zh:"关注治理，以及高度互联的数字环境这一设想。"}},
          {a:'Mistral',t:{pt:'Abordagem mais quantitativa e “séria”, ancorada em números.',en:'A more quantitative, “serious” approach anchored in numbers.',fr:'Approche plus quantitative et « sérieuse », ancrée dans les chiffres.',zh:"更偏量化、更“严肃”，以数字为依据。"}}],
  data_note:{pt:'Os dados vêm das transcrições dos diários (Tactiq). A transcrição da aula 2 do grupo C1 repete a da aula 1 e foi excluída das contagens da aula 2. Notas e estratégias são codificações editoriais e podem ser revistas.',en:'Data come from the logbook transcripts (Tactiq). Group C1’s class-2 transcript repeats its class-1 text and was excluded from class-2 counts. Grades and strategies are editorial codings and can be revised.',fr:'Les données viennent des transcriptions des journaux (Tactiq). La transcription du cours 2 du groupe C1 répète celle du cours 1 et a été exclue des comptages du cours 2. Notes et stratégies sont des codages éditoriaux révisables.',zh:"数据来自日志转录文本（Tactiq）。C1 组第 2 次课的转录与第 1 次课相同，已从第 2 次课的统计中剔除。评分与策略属于编辑性编码，可以修订。"}

 s3:{
  eyebrow:{pt:'Ensaios',en:'Essays',fr:'Essais',zh:"研究作品"},
  title:{pt:'Uma avenida e|múltiplas possibilidades',en:'One avenue and|multiple possibilities',fr:'Une avenue et|de multiples possibilités',zh:"一条大道，|多种可能"},
  intro:{pt:'Buchanan propõe que o design opera em registros distintos. Cada tema pede uma ordem diferente — e é na comparação entre elas que a pergunta sobre a IA ganha forma. Escolha um tema.',en:'Buchanan proposes that design works in distinct registers. Each theme calls for a different order — and the question about AI takes shape in comparing them. Pick a theme.',fr:'Buchanan propose que le design opère dans des registres distincts. Chaque thème appelle un ordre différent — et c’est en les comparant que la question sur l’IA prend forme. Choisissez un thème.',zh:"布坎南提出，设计在不同的层面上运作。每个主题对应不同的层级，而关于人工智能的问题，正是在比较它们时成形。请选择一个主题。"},
  themes:{
   A:{n:{pt:'Produto / Mobiliário urbano',en:'Product / Urban furniture',fr:'Produit / Mobilier urbain',zh:"产品 / 城市家具"},o:{pt:'2ª ordem — objetos',en:'2nd order — objects',fr:'2e ordre — objets',zh:"第 2 层级 — 物件"},d:{pt:'Mobiliário urbano adaptativo que ativa um trecho da avenida à noite. Aqui a IA gera formas e imagens com facilidade — o risco é fechar o objeto antes de entender o lugar.',en:'Adaptive urban furniture that activates a stretch of the avenue at night. Here AI generates forms and images easily — the risk is closing the object before understanding the place.',fr:'Mobilier urbain adaptatif qui active un tronçon de l’avenue la nuit. Ici l’IA génère formes et images avec facilité — le risque est de fermer l’objet avant de comprendre le lieu.',zh:"可适应的城市家具，在夜晚激活大道的一段。在这里，人工智能很容易生成形态与图像，风险在于还没弄懂场所就把物件定死了。"}},
   B:{n:{pt:'Interação e Comunicação',en:'Interaction & Communication',fr:'Interaction et Communication',zh:"互动与传播"},o:{pt:'1ª + 3ª ordens — símbolos e interações',en:'1st + 3rd orders — symbols & interactions',fr:'1er + 3e ordres — symboles et interactions',zh:"第 1 + 第 3 层级 — 符号与互动"},d:{pt:'Peça gráfica dinâmica (vídeo) para ativação local e mundial. Imagem, narrativa e interface: a IA entra como material estético e como multiplicadora de variações.',en:'Dynamic graphic piece (video) for local and global activation. Image, narrative and interface: AI enters as aesthetic material and as a multiplier of variations.',fr:'Pièce graphique dynamique (vidéo) pour une activation locale et mondiale. Image, récit et interface : l’IA entre comme matière esthétique et multiplicateur de variations.',zh:"动态图形作品（视频），用于本地与全球的激活。图像、叙事与界面：人工智能既是审美材料，也是变化的倍增器。"}},
   C:{n:{pt:'Serviço Urbanístico',en:'Urban Service',fr:'Service urbain',zh:"城市服务"},o:{pt:'3ª + 4ª ordens — serviço e sistemas',en:'3rd + 4th orders — service & systems',fr:'3e + 4e ordres — service et systèmes',zh:"第 3 + 第 4 层级 — 服务与系统"},d:{pt:'Modelo de programação ou gestão do trecho, funcionando 24h/7. Problema de sistema: a IA ajuda a ler, cruzar e simular, mas as decisões dependem de regras, atores e governança.',en:'A programming or management model for the stretch, running 24/7. A systems problem: AI helps read, cross-reference and simulate, but decisions depend on rules, actors and governance.',fr:'Modèle de programmation ou de gestion du tronçon, 24h/7. Problème de système : l’IA aide à lire, croiser et simuler, mais les décisions dépendent de règles, d’acteurs et de gouvernance.',zh:"一个针对该路段的节目策划或管理模式，全天候 24/7 运行。这是一个系统问题：人工智能帮助阅读、交叉比对和模拟，但决定取决于规则、参与方与治理。"}}},
  assets:{poster:{pt:'Pôster',en:'Poster',fr:'Affiche',zh:"海报"},image:{pt:'Imagem',en:'Image',fr:'Image',zh:"图像"},photo:{pt:'Fotografia',en:'Photo',fr:'Photo',zh:"照片"},video:{pt:'Vídeo (quadros)',en:'Video (frames)',fr:'Vidéo (images)',zh:"视频（画面）"},doc:{pt:'Prancha',en:'Sheet',fr:'Planche',zh:"图版"}},
  vid_note:{pt:'Os quadros marcados como vídeo são storyboards; o vídeo do projeto entra na abertura, no lugar da imagem de capa.',en:'Frames marked as video are storyboards; the project video goes in the opening, in place of the cover image.',fr:'Les images marquées vidéo sont des storyboards ; la vidéo du projet prend place à l’ouverture, à la place de l’image de couverture.',zh:"标为视频的画面是分镜；项目视频会放在开篇，取代封面图。"},
  blk_h:{pt:'Dados e insights do bloco',en:'Block data and insights',fr:'Données et enseignements du bloc',zh:"本组数据与洞察"},
  spider_h:{pt:'Comparativo pelos seis eixos',en:'Six-axis comparison',fr:'Comparaison sur les six axes',zh:"六维度比较"},
  spider_s:{pt:'Toque num projeto da legenda para ver seu diferencial; toque no nome de um eixo para ver o ranking e o critério.',en:'Tap a project in the legend to see its distinctive trait; tap an axis name to see the ranking and the criterion.',fr:'Touchez un projet dans la légende pour voir sa singularité ; touchez le nom d’un axe pour voir le classement et le critère.',zh:"点击图例中的项目，查看它的特点；点击维度名称，查看排名与标准。"},
  m_theme:{pt:'Este tema',en:'This theme',fr:'Ce thème',zh:"本主题"},m_all:{pt:'Todos os 12 ensaios',en:'All 12 essays',fr:'Les 12 essais',zh:"全部 12 个作品"},
  spider_note:{pt:'Notas preliminares (1–5), atribuídas a partir dos pôsteres, imagens e fotos da banca final, e do uso crítico declarado da IA. Servem de ponto de partida e devem ser substituídas pela avaliação cruzada da aula 4.',en:'Preliminary scores (1–5), assigned from the posters, images and photos of the final review, and the declared critical use of AI. They are a starting point and should be replaced by the cross-evaluation from class 4.',fr:'Notes préliminaires (1–5), attribuées d’après les affiches, images et photos du jury final, et l’usage critique déclaré de l’IA. Point de départ à remplacer par l’évaluation croisée du cours 4.',zh:"初步评分（1–5），依据最终评审的海报、图像与照片，以及声明的对人工智能的批判性使用而定。仅作为起点，应以第 4 次课的交叉评价取代。"},
  strongest:{pt:'Ponto mais forte',en:'Strongest axis',fr:'Axe le plus fort',zh:"最强维度"},weakest:{pt:'Ponto a evoluir',en:'Axis to develop',fr:'Axe à développer',zh:"待提升维度"},rank:{pt:'Ranking neste eixo',en:'Ranking on this axis',fr:'Classement sur cet axe',zh:"此维度的排名"},
  blocks:{
   A:{stats:[{n:'4',l:{pt:'ensaios',en:'essays',fr:'essais',zh:"个作品"}},{n:'5',l:{pt:'IAs distintas nos diários do tema',en:'distinct AIs in the theme’s logbooks',fr:'IA distinctes dans les journaux du thème',zh:"本主题日志中提到的不同人工智能"}},{n:'3',l:{pt:'ensaios com vídeo na abertura',en:'essays with a video opening',fr:'essais avec vidéo en ouverture',zh:"个作品以视频开篇"}}],
      ins:[{pt:'A cor divide o tema: a pérgola e os casulos de som e luz trabalham madeira, terra e luz dourada (os casulos, com acento violeta); Divagar e os bancos-vitrine ficam em cinza e concreto, e só o vermelho do MASP quebra a calma dos bancos. Uns procuram calor para a avenida; outros se calam diante dela.',en:'Colour splits the theme: the pergola and the cocoons of sound and light work with wood, earth and golden light (the cocoons with a violet accent); Divagar and the display benches stay in grey and concrete, and only MASP’s red breaks the calm of the benches. Some look for warmth on the avenue; others go quiet before it.',fr:'La couleur divise le thème : la pergola et les cocons de son et de lumière travaillent bois, terre et lumière dorée (les cocons avec un accent violet) ; Divagar et les bancs-vitrines restent en gris et béton, et seul le rouge du MASP rompt le calme des bancs. Les uns cherchent la chaleur pour l’avenue ; les autres se taisent devant elle.',zh:"颜色把这个主题分成两部分：凉亭与声光茧用木材、泥土和金色光线（声光茧带一抹紫色）；Divagar 与展示长椅保持灰色与混凝土，只有 MASP 的红色打破了长椅的平静。一些作品为大道寻求温暖，另一些则在大道面前沉默。"},
           {pt:'Os quatro ensaios convergem em “pausa”: sentar, dar sombra, abrigar, ligar a rua às instituições culturais, da pérgola e dos casulos ao banco-vitrine e ao módulo para divagar. É o objeto como lugar de permanência numa avenida de passagem.',en:'The four essays converge on “pause”: sitting, shade, shelter, linking the street to cultural institutions, from the pergola and the cocoons to the display bench and the module for drifting. The object as a place to stay on an avenue of passage.',fr:'Les quatre essais convergent vers la « pause » : s’asseoir, ombrager, abriter, relier la rue aux institutions culturelles, de la pergola et des cocons au banc-vitrine et au module de flânerie. L’objet comme lieu de séjour sur une avenue de passage.',zh:"四个作品都落在“停顿”上：坐下、遮荫、庇护、把街道与文化机构连起来，从凉亭与声光茧，到展示长椅与用于漫游的模块。物件成为在一条过路的大道上停留的地方。"},
           {pt:'Dois ensaios mostram o papel da IA no próprio pôster: a pérgola, com 16 prompts mantidos, revisados ou rejeitados, e os casulos, com o que foi descartado (estética genérica, propostas fora do contexto local). Nos bancos-vitrine, a IA entrou nos renders em situação, e a modelagem ficou humana, no Fusion 360.',en:'Two essays show the role of AI on the poster itself: the pergola, with 16 prompts kept, revised or rejected, and the cocoons, with what was discarded (generic aesthetics, proposals not fitted to the local context). In the display benches, AI entered the in-situ renders, and the modelling stayed human, in Fusion 360.',fr:'Deux essais montrent le rôle de l’IA sur l’affiche elle-même : la pergola, avec 16 prompts gardés, révisés ou rejetés, et les cocons, avec ce qui a été écarté (esthétique générique, propositions non adaptées au contexte local). Pour les bancs-vitrines, l’IA est entrée dans les rendus en situation, et la modélisation est restée humaine, dans Fusion 360.',zh:"有两个作品把人工智能的角色直接写在海报上：凉亭有 16 条被保留、修改或否决的提示词，声光茧写出了被舍弃的内容（泛化的审美、不适合本地情境的提案）。在展示长椅中，人工智能用于现场渲染，建模仍由人在 Fusion 360 中完成。"}]},
   B:{stats:[{n:'4',l:{pt:'ensaios',en:'essays',fr:'essais',zh:"个作品"}},{n:'10',l:{pt:'IAs distintas nos diários do tema, o maior leque',en:'distinct AIs in the theme’s logbooks, the widest range',fr:'IA distinctes dans les journaux du thème, la plus large palette',zh:"本主题日志中提到的不同人工智能，数量最多"}},{n:'4',l:{pt:'ensaios com vídeo na abertura',en:'essays with a video opening',fr:'essais avec vidéo en ouverture',zh:"个作品以视频开篇"}}],
      ins:[{pt:'O azul e o violeta dominam, mas cada ensaio tem seu matiz: duotone azul e vermelho em “identidades vivas”, azul-marinho e verde em “Choose your Paulista”, violeta em “Paulista Talks”. O Selo é a exceção, em creme e coral. O tema que mais trabalhou imagem em movimento escolheu cores frias e luminosas.',en:'Blue and violet dominate, but each essay has its own hue: blue and red duotone in “living identities”, navy and green in “Choose your Paulista”, violet in “Paulista Talks”. Selo is the exception, in cream and coral. The theme that worked most with moving image picked cool, luminous colours.',fr:'Le bleu et le violet dominent, mais chaque essai a sa teinte : duotone bleu et rouge dans « identités vivantes », bleu marine et vert dans « Choose your Paulista », violet dans « Paulista Talks ». Selo fait exception, en crème et corail. Le thème qui a le plus travaillé l’image en mouvement a choisi des couleurs froides et lumineuses.',zh:"蓝色与紫色占主导，但每个作品都有自己的色调：“活的身份”是蓝红双色调，“选择你的保利斯塔”是藏青与绿色，“Paulista Talks”是紫色。Selo 是例外，用的是奶油色与珊瑚色。最多使用动态影像的主题，选择了清冷而明亮的色彩。"},
           {pt:'Os quatro ensaios querem dar voz à avenida: fachadas que reagem às pessoas, quatro Paulistas ao longo do dia, uma avenida-relógio que conta a própria história e um passaporte digital. Três deles tratam a avenida como superfície de luz ou de projeção, e todos têm vídeo.',en:'The four essays want to give the avenue a voice: façades that react to people, four Paulistas through the day, an avenue-clock that tells its own history and a digital passport. Three of them treat the avenue as a surface of light or projection, and all have a video.',fr:'Les quatre essais veulent donner une voix à l’avenue : façades qui réagissent aux gens, quatre Paulistas au fil de la journée, une avenue-horloge qui raconte sa propre histoire et un passeport numérique. Trois d’entre eux traitent l’avenue comme une surface de lumière ou de projection, et tous ont une vidéo.',zh:"四个作品都想给大道一个声音：对人作出反应的立面、一天中的四个保利斯塔、讲述自身历史的“大道时钟”，以及一本数字护照。其中三个把大道当作光或投影的表面，而且都有视频。"},
           {pt:'Foi o tema com maior diversidade de IAs e de “sotaques”, e o que mais documenta a conversa com a IA: o Paulista Talks registra o que descartou e define o que a IA faz e o que o grupo decide, e o Selo declara a cadeia de ferramentas. Comparar vozes de origens diferentes virou método de pesquisa.',en:'It had the greatest diversity of AIs and “accents”, and the one that documents most the conversation with AI: Paulista Talks records what it discarded and defines what AI does and what the group decides, and Selo declares its chain of tools. Comparing voices of different origins became a research method.',fr:'C’est le thème avec la plus grande diversité d’IA et d’« accents », et celui qui documente le plus la conversation avec l’IA : Paulista Talks consigne ce qu’il a écarté et définit ce que fait l’IA et ce que décide le groupe, et Selo déclare sa chaîne d’outils. Comparer des voix d’origines différentes est devenu une méthode de recherche.',zh:"它拥有最多样的人工智能和“口音”，也是对人工智能对话记录得最充分的主题：Paulista Talks 记下了它舍弃了什么，并界定了人工智能做什么、小组决定什么；Selo 则公开了自己的工具链。比较不同来源的声音，成为一种研究方法。"}]},
   C:{stats:[{n:'4',l:{pt:'ensaios',en:'essays',fr:'essais',zh:"个作品"}},{n:'6',l:{pt:'IAs distintas nos diários do tema',en:'distinct AIs in the theme’s logbooks',fr:'IA distinctes dans les journaux du thème',zh:"本主题日志中提到的不同人工智能"}},{n:'4',l:{pt:'estruturas no sistema flexível: ágora, quiosque, palco de DJ e árvore',en:'structures in the flexible system: agora, kiosk, DJ stage and tree',fr:'structures du système flexible : agora, kiosque, scène DJ et arbre',zh:"灵活系统中的结构：广场、售货亭、DJ 舞台和树"}}],
      ins:[{pt:'O vermelho organiza dois ensaios (Paulista Viva e Paulista 2050), com o vermelho do MASP como fio condutor; a avenida como museu trabalha em preto e branco; os sistemas flexíveis ficam em madeira clara e tecido, com um acento laranja-avermelhado de identidade brasileira.',en:'Red organises two essays (Paulista Viva and Paulista 2050), with MASP’s red as the common thread; the avenue as a museum works in black and white; the flexible systems stay in light wood and fabric, with an orange-red accent of Brazilian identity.',fr:'Le rouge organise deux essais (Paulista Viva et Paulista 2050), avec le rouge du MASP comme fil conducteur ; l’avenue comme musée travaille en noir et blanc ; les systèmes flexibles restent en bois clair et tissu, avec un accent orangé-rouge d’identité brésilienne.',zh:"红色组织了两个作品（Paulista Viva 和 Paulista 2050），以 MASP 的红色作为共同的线索；“大道作为博物馆”用黑白；灵活系统保持浅色木材与织物，带一抹体现巴西身份的橙红色。"},
           {pt:'Os ensaios tratam cultura como infraestrutura e transformam o dia a dia em programação: o arquipélago vertical empilha cultura, espaço público, natureza e mobilidade; os sistemas flexíveis levam a mesma ideia à escala do serviço, com quatro estruturas de mesma linguagem e usos diferentes, de dia e de noite.',en:'The essays treat culture as infrastructure and turn everyday life into programming: the vertical archipelago stacks culture, public space, nature and mobility; the flexible systems take the same idea to the scale of service, with four structures of the same language and different uses, by day and by night.',fr:'Les essais traitent la culture comme infrastructure et transforment le quotidien en programmation : l’archipel vertical empile culture, espace public, nature et mobilité ; les systèmes flexibles portent la même idée à l’échelle du service, avec quatre structures de même langage et d’usages différents, de jour comme de nuit.',zh:"这些作品把文化当作基础设施，把日常生活变成节目安排：垂直群岛把文化、公共空间、自然与交通叠在一起；灵活系统把同样的想法带到服务的尺度，用语言一致、用途各异的四种结构，白天与夜晚都能使用。"},
           {pt:'Aqui a IA foi mais usada para ler, cruzar e sintetizar (Elicit, NotebookLM, mapas mentais) do que para gerar formas, e as hipóteses chegam com “a ser testadas”. Um ensaio partiu de maquetes físicas e usou renders e vídeo só para testar o que a maquete sugeria.',en:'Here AI was used more to read, cross-reference and synthesise (Elicit, NotebookLM, mind maps) than to generate forms, and hypotheses come labelled “to be tested”. One essay started from physical models and used renders and video only to test what the model suggested.',fr:'Ici l’IA a surtout servi à lire, croiser et synthétiser (Elicit, NotebookLM, cartes mentales) plutôt qu’à générer des formes, et les hypothèses arrivent « à éprouver ». Un essai est parti de maquettes physiques et n’a utilisé rendus et vidéo que pour tester ce que la maquette suggérait.',zh:"在这里，人工智能更多用于阅读、交叉比对与综合（Elicit、NotebookLM、思维导图），而不是生成形态，假设也都标明“有待检验”。有一个作品从实体模型出发，只用渲染图和视频来检验模型的提示。"}]}}

  intro:{pt:'Comparativo geral do que foi produzido: cor, tipografia, geometria e poética. As cores são medidas nas imagens e pôsteres entregues; as demais leituras são editoriais.',en:'Overall comparison of what was produced: colour, typography, geometry and poetics. Colours are measured from the images and posters submitted; the other readings are editorial.',fr:'Comparaison générale de ce qui a été produit : couleur, typographie, géométrie et poétique. Les couleurs sont mesurées sur les images et affiches remises ; les autres lectures sont éditoriales.',zh:"对所产出内容的总体比较：色彩、字体、几何和诗意。色彩是从提交的图像和海报中测得的；其余的解读属于编辑性判断。"},
  col_h:{pt:'Cor: onde as escolhas se concentraram',en:'Colour: where choices concentrated',fr:'Couleur : où les choix se sont concentrés',zh:"色彩：选择集中在哪里"},
  col_s:{pt:'Cada ponto é uma cor dominante de um ensaio: o ângulo é o matiz, a distância do centro é a saturação, o tamanho é o peso na imagem. As barras externas somam o matiz de cada tema.',en:'Each dot is a dominant colour from an essay: angle is hue, distance from centre is saturation, size is weight in the image. The outer bars sum each theme’s hue.',fr:'Chaque point est une couleur dominante d’un essai : l’angle est la teinte, la distance au centre la saturation, la taille le poids dans l’image. Les barres extérieures cumulent la teinte de chaque thème.',zh:"每个点是某个作品的一种主色：角度表示色相，离中心的距离表示饱和度，大小表示在图像中的占比。外圈的条形累计每个主题的色相。"},
  all:{pt:'Todos',en:'All',fr:'Tous',zh:"全部"},
  col_read:{pt:'Leitura: cada ordem tendeu a uma cor. O Tema A ficou na terra, na madeira e na luz dourada (pérgola e casulos de som e luz, estes com acento violeta); o B no azul e no violeta (com o Selo em creme e coral); o C no vermelho. Divagar e os bancos-vitrine ficaram quase só em cinza e branco, com o vermelho do MASP como único acento forte, e os sistemas flexíveis do Tema C ficaram em madeira clara, com um acento laranja-avermelhado, fora do vermelho dos outros ensaios.',en:'Reading: each order leaned to a colour. Theme A stayed in earth, wood and golden light (the pergola and the cocoons of sound and light, the latter with a violet accent); B in blue and violet (with Selo in cream and coral); C in red. Divagar and the display benches stayed almost entirely in grey and white, with MASP’s red as the only strong accent, and Theme C’s flexible systems stayed in light wood, with an orange-red accent, outside the red of the other essays.',fr:'Lecture : chaque ordre a tendu vers une couleur. Le Thème A est resté dans la terre, le bois et la lumière dorée (la pergola et les cocons de son et de lumière, ces derniers avec un accent violet) ; le B dans le bleu et le violet (avec Selo en crème et corail) ; le C dans le rouge. Divagar et les bancs-vitrines sont restés presque tout en gris et blanc, avec le rouge du MASP comme seul accent fort, et les systèmes flexibles du Thème C sont restés en bois clair, avec un accent orangé-rouge, hors du rouge des autres essais.',zh:"解读：每个层级都倾向一种颜色。主题 A 停留在泥土、木材与金色光线（凉亭与声光茧，后者带紫色点缀）；B 在蓝与紫（Selo 为奶油与珊瑚色）；C 在红色。Divagar 与展示长椅几乎完全是灰与白，MASP 的红色是唯一强烈的点缀；主题 C 的灵活系统则是浅色木材，带一抹橙红，不在其他作品的红色之内。"},

  eyebrow:{pt:'Achados e insights',en:'Findings and insights',fr:'Résultats et enseignements',zh:"发现与洞察"},
  title:{pt:'O que o grupo fez em cada etapa',en:'What the class did at each stage',fr:'Ce que la classe a fait à chaque étape',zh:"班级在每个阶段做了什么"},
  scope:{pt:'Contexto e Insights vêm dos diários em áudio. Ideação e Soluções vêm dos artefatos (pôsteres, imagens, registro de prompts, fotos da banca); os áudios das aulas 3 e 4 ainda não foram incorporados.',en:'Context and Insights come from the audio logbooks. Ideation and Solutions come from the artefacts (posters, images, prompt record, photos of the review); the audio of classes 3 and 4 has not been incorporated yet.',fr:'Contexte et Insights viennent des journaux audio. Idéation et Solutions viennent des artefacts (affiches, images, registre de prompts, photos du jury) ; les audios des cours 3 et 4 ne sont pas encore intégrés.',zh:"情境与洞察来自音频日志。构思与方案来自成果物（海报、图像、提示词记录、评审时的照片）；第 3、4 次课的音频尚未纳入。"},
