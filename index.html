sign.", "en": "What has already concentrated and what is still scattered in the conversation of 02/11/2026, in three layers: students, lab research and the design community.", "fr": "Ce qui s’est déjà concentré et ce qui reste dispersé dans la conversation du 02/11/2026, en trois couches : étudiants, recherche du laboratoire et communauté du design.", "zh": "2026 年 11 月 2 日那场对话中，已经汇聚与仍然分散的内容，分为三个层面：学生、实验室研究与设计社群。"}, "tp_hint": {"pt": "Localize o número no relevo · leia a trilha abaixo · quanto mais anéis, mais concentrado. Altitude = quanto o tema apareceu e convergiu (leitura dos pesquisadores, sujeita a ajuste).", "en": "Find the number on the relief · read the trail below · the more rings, the more concentrated. Altitude = how much the topic appeared and converged (the researchers’ reading, open to adjustment).", "fr": "Repérez le numéro sur le relief · lisez le parcours ci-dessous · plus il y a d’anneaux, plus c’est concentré. Altitude = combien le thème est apparu et a convergé (lecture des chercheurs, sujette à ajustement).", "zh": "在地形上找到编号，再读下方的路径；等高线越密，越集中。海拔 = 这个主题出现与收敛的程度（研究者的解读，可调整）。"}, "isl": {"pt": "Ilha", "en": "Island", "fr": "Île", "zh": "岛"}, "lay": {"pt": "Camada", "en": "Layer", "fr": "Couche", "zh": "层"}, "islt": [{"pt": "Alunos", "en": "Students", "fr": "Étudiants", "zh": "学生"}, {"pt": "Pesquisa do lab", "en": "Lab research", "fr": "Recherche du lab", "zh": "实验室研究"}, {"pt": "Comunidade de design", "en": "Design community", "fr": "Communauté du design", "zh": "设计社群"}], "lg1": {"pt": "concentrado: foi discutido e convergiu", "en": "concentrated: discussed and converged", "fr": "concentré : discuté et convergé", "zh": "集中：已被讨论并形成共识"}, "lg2": {"pt": "em formação: apareceu, sem fechar", "en": "forming: appeared, not yet closed", "fr": "en formation : apparu, pas encore tranché", "zh": "形成中：已出现，尚未定论"}, "lg3": {"pt": "disperso ou aberto: citado de passagem", "en": "scattered or open: mentioned in passing", "fr": "dispersé ou ouvert : cité en passant", "zh": "分散或开放：只是顺带提及"}, "lgm": {"pt": "SOBRE · PARA · NA = modo de aprender de Frayling (1993) em que o ponto atua. Ver prancha 02.", "en": "INTO · FOR · THROUGH = Frayling’s (1993) mode of learning in which the point operates. See board 02.", "fr": "SUR · POUR · PAR = mode d’apprentissage de Frayling (1993) dans lequel le point agit. Voir la planche 02.", "zh": "关于 · 为了 · 通过 = 弗雷林（1993）提出的学习方式，表示该点主要在哪一种方式中起作用。见图板 02。"}, "trail": {"pt": "Trilha de sustentação · 21 pontos", "en": "Supporting trail · 21 points", "fr": "Parcours d’appui · 21 points", "zh": "支撑路径 · 21 个点"}, "tp_src": {"pt": "Fonte: transcrição da conversa Anderson Penha × Julien Sappa (02/11/2026, 78 min).", "en": "Source: transcript of the conversation Anderson Penha × Julien Sappa (02/11/2026, 78 min).", "fr": "Source : transcription de la conversation Anderson Penha × Julien Sappa (02/11/2026, 78 min).", "zh": "来源：Anderson Penha 与 Julien Sappa 对话的转录文本（2026 年 11 月 2 日，78 分钟）。"}, "fr_title": {"pt": "Impacto de aprender SOBRE, PARA e NA prática do design com uso de IA por alunos de Design", "en": "Impact of learning INTO, FOR and THROUGH design practice with AI among design students", "fr": "Impact de l’apprentissage SUR, POUR et PAR la pratique du design avec l’IA chez des étudiants en design", "zh": "设计专业学生借助人工智能，“关于”“为了”“通过”设计实践来学习的影响"}, "fr_sub": {"pt": "Como organizamos o uso de IA no processo criativo de design a partir dos três modos de pesquisa em arte e design de Christopher Frayling.", "en": "How we organise the use of AI in the creative design process from Christopher Frayling’s three modes of research in art and design.", "fr": "Comment nous organisons l’usage de l’IA dans le processus créatif de design à partir des trois modes de recherche en art et design de Christopher Frayling.", "zh": "我们如何依据克里斯托弗·弗雷林提出的艺术与设计研究的三种方式，来组织人工智能在设计创作过程中的使用。"}, "fr_in": {"pt": "Entender o que a IA é e como entra na cultura do design: referências, repertório e leitura crítica.", "en": "Understand what AI is and how it enters design culture: references, repertoire and critical reading.", "fr": "Comprendre ce qu’est l’IA et comment elle entre dans la culture du design : références, répertoire et lecture critique.", "zh": "理解人工智能是什么，以及它如何进入设计文化：参考资料、积累与批判性阅读。"}, "fr_for": {"pt": "Usar a IA para produzir design: o resultado é um artefato (cartaz, maquete, protótipo).", "en": "Use AI to produce design: the result is an artefact (poster, model, prototype).", "fr": "Utiliser l’IA pour produire du design : le résultat est un artefact (affiche, maquette, prototype).", "zh": "用人工智能来产出设计：成果是一件作品（海报、模型、原型）。"}, "fr_th": {"pt": "Aprender e pesquisar dentro do fazer: o processo, as threads e o mapa viram dado.", "en": "Learn and research from within making: the process, the threads and the map become data.", "fr": "Apprendre et chercher au cœur du faire : le processus, les threads et la carte deviennent des données.", "zh": "在“做”的过程中学习与研究：过程、提示词记录和地图都成为数据。"}, "fr_ctr": {"pt": "IA NO PROCESSO CRIATIVO", "en": "AI IN THE CREATIVE PROCESS", "fr": "L’IA DANS LE PROCESSUS CRÉATIF", "zh": "创作过程中的人工智能"}, "inlab": {"pt": "No laboratório", "en": "In the lab", "fr": "Dans le laboratoire", "zh": "在实验室中"}, "box_in": [{"pt": "Contexto e Insights: alunos estudam a Paulista com a IA, mas sem repertório para avaliar o que volta.", "en": "Context and Insights: students study Paulista with AI, but without the repertoire to assess what comes back.", "fr": "Contexte et Insights : les étudiants étudient la Paulista avec l’IA, mais sans répertoire pour évaluer ce qui revient.", "zh": "情境与洞察：学生借助人工智能研究保利斯塔，但缺乏判断其返回结果的积累。"}, {"pt": "Afogamento em informação e cartazes que “falam demais”.", "en": "Drowning in information and posters that “say too much”.", "fr": "Noyés sous l’information et des affiches qui « en disent trop ».", "zh": "淹没在信息之中，海报“说得太多”。"}, {"pt": "Comunidade: designers e professores reagindo à IA.", "en": "Community: designers and teachers reacting to AI.", "fr": "Communauté : designers et enseignants réagissant à l’IA.", "zh": "社群：设计师和教师对人工智能的反应。"}], "box_for": [{"pt": "Ideação e Solução: cartazes, maquete física com intervenção digital, protótipo de celular.", "en": "Ideation and Solution: posters, physical model with digital intervention, phone prototype.", "fr": "Idéation et Solution : affiches, maquette physique avec intervention numérique, prototype de téléphone.", "zh": "构思与方案：海报、带数字介入的实体模型、手机原型。"}, {"pt": "Alunos livres para usar ou não IA, em qualquer etapa.", "en": "Students free to use AI or not, at any stage.", "fr": "Étudiants libres d’utiliser ou non l’IA, à toute étape.", "zh": "学生可在任何阶段自由选择是否使用人工智能。"}, {"pt": "IA como operador sintético: quem dirige quem?", "en": "AI as a synthetic operator: who directs whom?", "fr": "L’IA comme opérateur synthétique : qui dirige qui ?", "zh": "人工智能作为合成式操作者：谁在指挥谁？"}], "box_th": [{"pt": "Threads de prompts: quem questiona, quantas vezes, o que se repete.", "en": "Prompt threads: who questions, how many times, what repeats.", "fr": "Threads de prompts : qui questionne, combien de fois, ce qui se répète.", "zh": "提示词记录：谁在提问、提了几次、什么在重复。"}, {"pt": "Diário de bordo em áudio por grupo e relatório final.", "en": "Audio logbook per group and final report.", "fr": "Journal de bord audio par groupe et rapport final.", "zh": "各小组的音频创作日志和最终报告。"}, {"pt": "A própria topografia da conversa como pesquisa através do design.", "en": "The topography of the conversation itself as research through design.", "fr": "La topographie de la conversation elle-même comme recherche par le design.", "zh": "把对话的地形图本身当作通过设计进行的研究。"}], "qs": {"pt": "Perguntas do lab", "en": "Lab questions", "fr": "Questions du lab", "zh": "实验室的问题"}, "q1": {"pt": "P1 Agência", "en": "P1 Agency", "fr": "P1 Agentivité", "zh": "P1 主导权"}, "q2": {"pt": "P2 Repertório", "en": "P2 Repertoire", "fr": "P2 Répertoire", "zh": "P2 积累"}, "q3": {"pt": "P3 Fronteira (efeito da IA por ordem de design)", "en": "P3 Frontier (effect of AI by order of design)", "fr": "P3 Frontière (effet de l’IA selon l’ordre de design)", "zh": "P3 边界（人工智能的影响随设计层级而变）"}, "qn": {"pt": "cruzam os três modos", "en": "cut across the three modes", "fr": "traversent les trois modes", "zh": "贯穿这三种方式"}, "mx_head": {"pt": "Como os três modos se distribuíram nas 4 aulas · leitura a partir da transcrição, sujeita a ajuste", "en": "How the three modes were spread over the 4 classes · reading from the transcript, open to adjustment", "fr": "Comment les trois modes se sont répartis sur les 4 cours · lecture à partir de la transcription, sujette à ajustement", "zh": "三种方式在四次课中的分布 · 依据转录文本的解读，可调整"}, "cls": [{"pt": "Aula 1", "en": "Class 1", "fr": "Cours 1", "zh": "第 1 次课"}, {"pt": "Aula 2", "en": "Class 2", "fr": "Cours 2", "zh": "第 2 次课"}, {"pt": "Aula 3", "en": "Class 3", "fr": "Cours 3", "zh": "第 3 次课"}, {"pt": "Aula 4", "en": "Class 4", "fr": "Cours 4", "zh": "第 4 次课"}], "stg": [{"pt": "Contexto", "en": "Context", "fr": "Contexte", "zh": "情境"}, {"pt": "Insights", "en": "Insights", "fr": "Insights", "zh": "洞察"}, {"pt": "Ideação", "en": "Ideation", "fr": "Idéation", "zh": "构思"}, {"pt": "Solução", "en": "Solution", "fr": "Solution", "zh": "方案"}], "st": {"p": {"pt": "predomina", "en": "predominant", "fr": "domine", "zh": "为主"}, "o": {"pt": "pontual", "en": "occasional", "fr": "ponctuel", "zh": "偶尔"}, "a": {"pt": "atravessa", "en": "runs through", "fr": "traverse", "zh": "贯穿"}}, "mx_end": {"pt": "Em contexto e insights, a IA entrou como fonte de leitura do território (SOBRE); em ideação e solução, como operador de produção (PARA). O NA atravessou todas as etapas pelas threads e pelo diário de bordo.", "en": "In context and insights, AI came in as a source for reading the territory (INTO); in ideation and solution, as a production operator (FOR). THROUGH ran through every stage by way of the threads and the logbook.", "fr": "En contexte et insights, l’IA est entrée comme source de lecture du territoire (SUR) ; en idéation et solution, comme opérateur de production (POUR). Le PAR a traversé toutes les étapes par les threads et le journal de bord.", "zh": "在情境与洞察阶段，人工智能是阅读场地的来源（关于）；在构思与方案阶段，它是制作的操作者（为了）。“通过”则借助提示词记录和创作日志，贯穿了所有阶段。"}, "fr_ref": {"pt": "Frayling, C. (1993). Research in Art and Design. Royal College of Art Research Papers, 1(1), 1–5. · Etapas das aulas: Beckman & Barry, Innovation as a Learning Process. · Tradução adotada: INTO = SOBRE, FOR = PARA, THROUGH = NA (através da prática).", "en": "Frayling, C. (1993). Research in Art and Design. Royal College of Art Research Papers, 1(1), 1–5. · Class stages: Beckman & Barry, Innovation as a Learning Process. · Translation adopted: INTO = SOBRE, FOR = PARA, THROUGH = NA (through practice).", "fr": "Frayling, C. (1993). Research in Art and Design. Royal College of Art Research Papers, 1(1), 1–5. · Étapes des cours : Beckman & Barry, Innovation as a Learning Process. · Traduction retenue : INTO = SUR, FOR = POUR, THROUGH = PAR (à travers la pratique).", "zh": "Frayling, C. (1993). Research in Art and Design. Royal College of Art Research Papers, 1(1), 1–5. · 课程阶段：Beckman 与 Barry，Innovation as a Learning Process。· 采用的译法：INTO = 关于，FOR = 为了，THROUGH = 通过（经由实践）。"}}, "pts": [{"n": 1, "i": 0, "m": "SOBRE", "a": 5, "x": 124, "y": 173, "t": {"pt": "REPERTÓRIO PARA CRITICAR", "en": "REPERTOIRE TO CRITIQUE", "fr": "RÉPERTOIRE POUR CRITIQUER", "zh": "用于批判的积累"}, "d": {"pt": "Sem repertório formado, o aluno não “bate o olho” e reconhece a referência: a crítica do que a IA devolve fica frágil.", "en": "Without an established repertoire, the student cannot “see at a glance” and recognise the reference: the critique of what AI returns becomes fragile.", "fr": "Sans répertoire constitué, l’étudiant ne « reconnaît pas d’un coup d’œil » la référence : la critique de ce que l’IA renvoie devient fragile.", "zh": "没有形成积累，学生就无法“一眼认出”参考来源：对人工智能返回内容的批判就变得脆弱。"}}, {"n": 2, "i": 0, "m": "NA", "a": 5, "x": 160, "y": 228, "t": {"pt": "QUESTIONAR A IA NAS THREADS", "en": "QUESTIONING AI IN THE THREADS", "fr": "QUESTIONNER L’IA DANS LES THREADS", "zh": "在提示词记录中质疑人工智能"}, "d": {"pt": "A maioria questionou e redirecionou a IA, alguns de 3 a 5 vezes na mesma thread. A visão crítica aparece no fazer.", "en": "Most questioned and redirected the AI, some 3 to 5 times in the same thread. The critical view appears in the making.", "fr": "La plupart ont questionné et redirigé l’IA, certains de 3 à 5 fois dans le même thread. Le regard critique apparaît dans le faire.", "zh": "大多数人质疑并重新引导了人工智能，有些人在同一条记录里这样做了 3 到 5 次。批判性视角体现在“做”的过程中。"}}, {"n": 3, "i": 0, "m": "SOBRE", "a": 4, "x": 173, "y": 280, "t": {"pt": "AFOGAMENTO EM INFORMAÇÃO", "en": "DROWNING IN INFORMATION", "fr": "SUBMERGÉS PAR L’INFORMATION", "zh": "淹没在信息中"}, "d": {"pt": "Dificuldade de conduzir perguntas em contexto e insight; cartazes que “falam demais” e satisfazem pela quantidade.", "en": "Difficulty in steering questions in context and insight; posters that “say too much” and satisfy through quantity.", "fr": "Difficulté à conduire les questions en contexte et insight ; des affiches qui « en disent trop » et satisfont par la quantité.", "zh": "在情境与洞察阶段难以引导提问；海报“说得太多”，靠数量来满足。"}}, {"n": 4, "i": 0, "m": "PARA", "a": 4, "x": 106, "y": 336, "t": {"pt": "MAQUETE FÍSICA + IA", "en": "PHYSICAL MODEL + AI", "fr": "MAQUETTE PHYSIQUE + IA", "zh": "实体模型 + 人工智能"}, "d": {"pt": "O grupo que uniu maquete manual e intervenção digital ganhou viabilidade e tangibilizou a ideia. Quem evitou construir à mão perdeu força.", "en": "The group that joined a handmade model with digital intervention gained feasibility and made the idea tangible. Those who avoided building by hand lost strength.", "fr": "Le groupe qui a uni maquette manuelle et intervention numérique a gagné en faisabilité et a rendu l’idée tangible. Ceux qui ont évité de construire à la main ont perdu en force.", "zh": "把手工模型与数字介入结合的小组，提高了可行性，也让想法变得可触摸。回避动手制作的小组则失去了说服力。"}}, {"n": 5, "i": 0, "m": "NA", "a": 2, "x": 136, "y": 113, "t": {"pt": "ÁGUA, ENERGIA E PI", "en": "WATER, ENERGY AND IP", "fr": "EAU, ÉNERGIE ET PI", "zh": "水、能源与知识产权"}, "d": {"pt": "Levantado pelos próprios alunos (custo ambiental, propriedade intelectual). Ainda sem análise de impacto: aberto.", "en": "Raised by the students themselves (environmental cost, intellectual property). No impact analysis yet: open.", "fr": "Soulevé par les étudiants eux-mêmes (coût environnemental, propriété intellectuelle). Pas encore d’analyse d’impact : ouvert.", "zh": "由学生自己提出（环境成本、知识产权）。尚无影响分析：保持开放。"}}, {"n": 6, "i": 0, "m": "PARA", "a": 2, "x": 101, "y": 391, "t": {"pt": "QUEM NÃO USOU IA", "en": "THE ONE WHO DID NOT USE AI", "fr": "CELUI QUI N’A PAS UTILISÉ L’IA", "zh": "没有使用人工智能的人"}, "d": {"pt": "Um aluno recusou a IA e não entregou algo consistente em 4 horas. Caso isolado, a tratar com cuidado.", "en": "One student refused AI and did not deliver anything consistent in 4 hours. An isolated case, to be handled with care.", "fr": "Un étudiant a refusé l’IA et n’a pas rendu quelque chose de consistant en 4 heures. Cas isolé, à traiter avec précaution.", "zh": "有一位学生拒绝使用人工智能，4 小时内没有交出像样的成果。这是个别情况，需谨慎对待。"}}, {"n": 7, "i": 0, "m": "NA", "a": 1, "x": 160, "y": 63, "t": {"pt": "ACEITAR TUDO SEM QUESTIONAR", "en": "ACCEPTING EVERYTHING UNQUESTIONED", "fr": "TOUT ACCEPTER SANS QUESTIONNER", "zh": "不加质疑地全盘接受"}, "d": {"pt": "Só um grupo seguiu o que a IA trouxe do começo ao fim (“é só um projeto que tenho que entregar”).", "en": "Only one group followed what AI brought from start to finish (“it’s just a project I have to hand in”).", "fr": "Un seul groupe a suivi ce que l’IA a apporté du début à la fin (« c’est juste un projet que je dois rendre »).", "zh": "只有一个小组从头到尾照搬人工智能给出的内容（“这只是一个我必须交的项目”）。"}}, {"n": 8, "i": 1, "m": "SOBRE", "a": 5, "x": 465, "y": 197, "t": {"pt": "JARDIM SEM CAMINHOS", "en": "GARDEN WITHOUT PATHS", "fr": "JARDIN SANS CHEMINS", "zh": "没有小径的花园"}, "d": {"pt": "Deixar os alunos caminharem livres e ver a rota que os pés marcam. Vocês como observadores, não como detentores do sab function smoothPath(pts){
  const n=pts.length; let d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);

    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+='C'+c1[0].toFixed(1)+','+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+','+c2[1].toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }

}
let _TR=null;
function heightField(W,H,cs){

}
function isoLines(F,lv){
  const {g,nx,ny,cs}=F,segs=[],lerp=(a,b,va,vb)=>a+(b-a)*((lv-va)/(vb-va));
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){

    const tb={1:[[Lf,T]],2:[[T,R]],3:[[Lf,R]],4:[[R,B]],5:[[Lf,T],[R,B]],6:[[T,B]],7:[[Lf,B]],8:[[B,Lf]],9:[[T,B]],10:[[T,R],[B,Lf]],11:[[R,B]],12:[[R,Lf]],13:[[T,R]],14:[[Lf,T]]};
    (tb[c]||[]).forEach(sg=>segs.push(sg));

  const key=p=>p[0].toFixed(2)+','+p[1].toFixed(2),adj=new Map();
  segs.forEach((sg,i)=>{sg.forEach(p=>{const k=key(p);if(!adj.has(k))adj.set(k,[]);adj.get(k).push(i)})});

        if(dir===0)line.push(nxt);else line.unshift(nxt);

    }
    lines.push(line);

function topoBlock(){
  const modes=NU.modes;
  const cols=[0,1,2].map(i=>`<div class="tcol"><div class="tch"><small>${esc((L(NU.isl)+' '+(i+1)+' · '+L(NU.lay)+' '+(i+1)).toUpperCase())}</small><h4>${esc(L(NU.islt[i]).toUpperCase())}</h4></div>${NPTS.filter(p=>p.i===i).map(p=>`<div class="tpi" data-pt="${p.n}" tabindex="0">${badge(p)}<div><b>${esc(L(p.t))}</b><span class="tm">${esc(L(modes[p.m]))} · ${esc(L(NU.alt))} ${p.a}</span><p>${esc(L(p.d))}</p></div></div>`).join('')}</div>`).join('');
  return `<article class="tp">
   <div class="pr">${esc(L(NU.p1))}</div><h3 class="ntt">${esc(L(NU.tp_title))}</h3>
   <p class="nsub">${esc(L(NU.tp_sub))}</p><p class="note nhint">${esc(L(NU.tp_hint))}</p>
   <div class="tpmap">${topoSVG()}</div>
   <div class="tplg"><span><i class="tb hi"></i><b>${esc(L(NU.alt))} 4–5</b> ${esc(L(NU.lg1))}</span><span><i class="tb mid"></i><b>${esc(L(NU.alt))} 3</b> ${esc(L(NU.lg2))}</span><span><i class="tb lo"></i><b>${esc(L(NU.alt))} 1–2</b> ${esc(L(NU.lg3))}</span></div>
   <p class="note">${esc(L(NU.lgm))}</p>
   <div class="trailh">${esc(L(NU.trail).toUpperCase())}</div>
   <div class="tcols">${cols}</div>
   <p class="note">${esc(L(NU.tp_src))}</p>
  </article>`;
}
function vennSVG(){
  const m=NU.modes, fo=(x,y,w,h,inner)=>`<foreignObject x="${x}" y="${y}" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" class="vtx">${inner}</div></foreignObject>`;
  return `<svg class="vsvg" viewBox="0 0 560 500" role="img" aria-label="${esc(L(NU.fr_title))}">
   <circle cx="205" cy="185" r="150" fill="#E7F2EA" fill-opacity=".8" stroke="#166B3B" stroke-width="2"/>
   <circle cx="355" cy="185" r="150" fill="#D9D9D9" fill-opacity=".55" stroke="#3D3D3D" stroke-width="2" stroke-dasharray="4 4"/>
   <circle cx="280" cy="315" r="150" fill="#F4F4F4" fill-opacity=".6" stroke="#1B1B1B" stroke-width="2.4"/>
   ${fo(78,92,160,170,`<b class="vh">${esc(L(m.SOBRE))}</b><i>research INTO art &amp; design</i><p>${esc(L(NU.fr_in))}</p>`)}
   ${fo(332,92,150,170,`<b class="vh">${esc(L(m.PARA))}</b><i>research FOR art &amp; design</i><p>${esc(L(NU.fr_for))}</p>`)}
   ${fo(178,336,204,130,`<b class="vh">${esc(L(m.NA))}</b><i>research THROUGH art &amp; design</i><p>${esc(L(NU.fr_th))}</p>`)}
   ${fo(236,208,88,58,`<div class="vc">${esc(L(NU.fr_ctr))}</div>`)}
  </svg>`;
}
function fraylingBlock(){
  const li=a=>`<ul>${a.map(x=>`<li>${esc(L(x))}</li>`).join('')}</ul>`;
  const st=NU.st;
  const rows=[['SOBRE',['p','p','o','o']],['PARA',['o','o','p','p']],['NA',['a','a','a','a']]];
  const grid=`<div class="mxs"><div class="mx"><div class="mxh"></div>${NU.cls.map((c,i)=>`<div class="mxh"><small>${esc(L(c).toUpperCase())}</small><b>${esc(L(NU.stg[i]))}</b></div>`).join('')}${rows.map(([k,v])=>`<div class="mxr"><b>${esc(L(NU.modes[k]))}</b><small>research ${k==='SOBRE'?'into':(k==='PARA'?'for':'through')}</small></div>${v.map(x=>`<div class="mxc st-${x}">${esc(L(st[x]))}</div>`).join('')}`).join('')}</div></div>`;
  return `<article class="fr">
   <div class="pr">${esc(L(NU.p2))}</div><h3 class="ntt">${esc(L(NU.fr_title))}</h3><p class="nsub">${esc(L(NU.fr_sub))}</p>
   <div class="frgrid">
    <div class="frb b1"><small>${esc(L(NU.inlab).toUpperCase())}</small>${li(NU.box_in)}</div>
    <div class="frv">${vennSVG()}</div>
    <div class="frb b2"><small>${esc(L(NU.inlab).toUpperCase())}</small>${li(NU.box_for)}</div>
    <div class="frb b3"><small>${esc(L(NU.qs).toUpperCase())}</small><p><b>${esc(L(NU.q1))}</b><br><b>${esc(L(NU.q2))}</b><br><b>${esc(L(NU.q3))}</b></p><em>${esc(L(NU.qn))}</em></div>
    <div class="frb b4"><small>${esc(L(NU.inlab).toUpperCase())}</small>${li(NU.box_th)}</div>
   </div>
   <div class="trailh">${esc(L(NU.mx_head).toUpperCase())}</div>
   ${grid}
   <p class="mxend">${esc(L(NU.mx_end))}</p>
   <p class="note">${esc(L(NU.fr_ref))}</p>
  </article>`;
}
function miniTopo(){return `<svg viewBox="0 0 1060 480" aria-hidden="true">${topoRings()}</svg>`}
function miniVenn(){return `<svg viewBox="40 20 480 450" aria-hidden="true"><circle cx="205" cy="185" r="150" fill="#E7F2EA" stroke="#166B3B" stroke-width="5"/><circle cx="355" cy="185" r="150" fill="#D9D9D9" fill-opacity=".6" stroke="#3D3D3D" stroke-width="5" stroke-dasharray="10 8"/><circle cx="280" cy="315" r="150" fill="#F4F4F4" fill-opacity=".7" stroke="#1B1B1B" stroke-width="6"/></svg>`}
function sNotes(){
  const open=S.notesOpen;
  return `<section class="s mint" id="notas"><div class="wrap notes${open?' open':''}">
   <div class="sec-head"><div class="eyebrow"><span class="dot"></span>${esc(L(NU.eyebrow))}</div><h2 class="big" style="max-width:none">${esc(L(NU.title)).split('|').join('<br>')}</h2></div>
   <p class="lead" style="margin-top:-14px">${esc(L(NU.intro))}</p>
   <div class="nbar"><button class="ntoggle" data-notes aria-expanded="${open}" aria-controls="nbody"><span class="tl">${esc(L(open?NU.close:NU.open))}</span><span class="chev" aria-hidden="true">▾</span></button><span class="nh">${esc(L(NU.hint))}</span></div>
   <div class="ncards">
     <button class="ncard" data-notes><div class="nth">${miniTopo()}</div><div class="pr">${esc(L(NU.p1))}</div><h4>${esc(L(NU.card1))}</h4><p>${esc(L(NU.card1d))}</p></button>
     <button class="ncard" data-notes><div class="nth">${miniVenn()}</div><div class="pr">${esc(L(NU.p2))}</div><h4>${esc(L(NU.card2))}</h4><p>${esc(L(NU.card2d))}</p></button>
   </div>
   <div class="nwrap" id="nbody" aria-hidden="${!open}"><div class="nin">${topoBlock()}${fraylingBlock()}<p class="note nby">${esc(L(NU.by))}</p></div></div>
  </div></section>`;
}
function refreshNotes(){
  const w=$('#notas .notes'); if(!w)return;
  w.classList.toggle('open',S.notesOpen);
  const b=$('#notas .ntoggle'); b.setAttribute('aria-expanded',String(S.notesOpen)); b.querySelector('.tl').textContent=L(S.notesOpen?NU.close:NU.open);
  $('#nbody').setAttribute('aria-hidden',String(!S.notesOpen));
}
function toggleNotes(){S.notesOpen=!S.notesOpen;refreshNotes()}
function ptHover(e){
  const t=e.target.closest&&e.target.closest('[data-pt]'); const n=t?t.dataset.pt:null;
  if(n===S.pt)return; S.pt=n;
  $$('[data-pt].hl').forEach(x=>x.classList.remove('hl'));
  if(n)$$('[data-pt="'+n+'"]').forEach(x=>x.classList.add('hl'));
}
document.addEventListener('mouseover',ptHover);
document.addEventListener('focusin',ptHover);

function sTeam(){
  const a=UI.s6;
  return `<section class="s gray" id="sobre"><div class="wrap">
  <div class="sec-head"><div class="eyebrow"><span class="dot"></span>${esc(L(a.eyebrow))}</div><h2 class="big">${esc(L(a.title))}</h2></div>
  <div class="about-grid">
    <div><a class="ph-slot" href="https://www.lecolededesign.com" target="_blank" rel="noopener" aria-label="L’École de design Nantes Atlantique"><img src="${img('edna')}" alt="L’École de design Nantes Atlantique"><span class="vs">${esc(L({pt:'Visitar o site da EDNA',en:'Visit the EDNA website',fr:'Visiter le site de l’EDNA',zh:"访问 EDNA 网站"}))}</span></a>
      <h3><a href="https://www.lecolededesign.com" target="_blank" rel="noopener" style="text-decoration:none">${esc(L(a.nantes_h))}</a></h3><p class="txt">${esc(L(a.nantes))}</p></div>
    <div><a class="ph-slot" href="https://www.instagram.com/brazilstudio_lecolededesign/" target="_blank" rel="noopener" aria-label="Instagram Brazil Studio"><img src="${img('cls1')}" alt="${esc(L(a.studio_cap))}" loading="lazy"></a>
      <h3><a href="https://www.instagram.com/brazilstudio_lecolededesign/" target="_blank" rel="noopener" style="text-decoration:none">${esc(L(a.studio_h))}</a></h3><p class="txt">${esc(L(a.studio))}</p></div>
  </div>
  ${studiosBlock()}
  ${studentsBlock()}
  <div class="sub-h"><h3>${esc(L(a.res_h))}</h3></div>
  <div class="people">${a.people.map(p=>`<div class="person"><div class="av">${IMG[p.k]?`<img src="${img(p.k)}" alt="${esc(p.n)}">`:p.i+`<small>${esc(L(a.photo_label))}</small>`}</div><h4>${esc(p.n)}</h4><div class="rl">${esc(L(p.r))}</div><p>${esc(L(p.t))}</p></div>`).join('')}</div>
  </div></section>
  <footer><div class="wrap"><div><big>${esc(L(a.foot))}</big><small>${esc(L(a.foot_s))}</small><small>${esc(L(UI.hero.meta))}</small></div><div class="logoW"><img src="${img('logo')}" alt="L’École de design Nantes Atlantique · Brazil Studio"></div></div></footer>`;
}

/* ---------- render / events ---------- */
function render(keepScroll){
  const y=window.scrollY;
  document.documentElement.lang=HTMLLANG[lang]||lang;
  renderHeader();
  $('#main').innerHTML=sAbout()+sData()+sEssays()+sAesth()+sFind()+sNotes()+sTeam();
  if($('#hero')&&$('#h-meta'))updateHero();
  document.title='Nantes Brazil Design Studio - AI LAB · Paulista 24/7';
  if(keepScroll)window.scrollTo(0,y);
  spy();watchVideos();
}
function rerenderEssays(){const y=window.scrollY;const el=$('#ensaios');const ne=document.createElement('div');ne.innerHTML=sEssays();el.replaceWith(ne.firstElementChild);window.scrollTo(0,y);spy();watchVideos()}
function setBU(t){S.buH=t||null;refreshBU()}
function openLB(id,i){const p=pj(id);S.lb={p,i};drawLB()}
function drawLB(){const{p,i}=S.lb;const a=p.assets[i];const lb=$('#lb');lb.classList.add('on');$('#lb-img').src=img(a.i);$('#lb-img').alt=L(a.c);$('#lb-cap').textContent=code(p)+' · '+L(p.title)+' — '+L(a.c);$('#lb .x').setAttribute('aria-label',L(UI.lb.close));$('#lb .x').focus()}
function lbStep(d){const{p,i}=S.lb;S.lb.i=(i+d+p.assets.length)%p.assets.length;drawLB()}
function closeLB(){$('#lb').classList.remove('on');S.lb=null}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-lang],[data-bb],[data-bu],[data-t],[data-sm],[data-sp],[data-ax],[data-off],[data-pal],[data-fc],[data-lb],[data-dl],[data-vs],[data-notes],.burger,#nav a');if(!t)return;
  if(t.matches('.burger')){$('#nav').classList.toggle('open');return}
  if(t.matches('[data-notes]')){toggleNotes();return}
  if(t.matches('#nav a')){$('#nav').classList.remove('open');return}
  const d=t.dataset;
  if(d.lang){lang=d.lang;try{localStorage.setItem('p247lang',lang)}catch(_){ }render(true);return}
  if(d.bb){S.bb=d.bb;const B=UI.s1.bb[d.bb];$$('[data-bb] path').forEach(p=>{});const box=$('.mbox');$('.mbox svg').outerHTML=bbSVG();$('#bb-detail').innerHTML=`<b>${esc(L(B.n))} · ${esc(L(B.m))}</b>${esc(L(B.t))}`;return}
  if(d.bu){return}
  if(d.t){S.tab=d.t;S.spSel=null;S.spAxis=null;S.spOff=new Set();setBU(null);rerenderEssays();return}
  if(d.sm){S.spMode=d.sm;S.spSel=null;S.spAxis=null;S.spOff=new Set();rerenderEssays();return}
  if(d.off){e.stopPropagation();S.spOff.has(d.off)?S.spOff.delete(d.off):S.spOff.add(d.off);refreshSpider();return}
  if(d.ax){S.spAxis=S.spAxis===d.ax?null:d.ax;refreshSpider();return}
  if(d.sp){S.spSel=d.sp;S.spAxis=null;S.spOff.delete(d.sp);refreshSpider();return}
  if(d.pal){S.pal=d.pal;const y=scrollY;const el=$('#estetica');const ne=document.createElement('div');ne.innerHTML=sAesth();el.replaceWith(ne.firstElementChild);scrollTo(0,y);return}
  if(d.fc){const[f,k]=d.fc.split(':');S.facet=(S.facet&&S.facet.f===f&&S.facet.k===k)?null:{f,k};const y=scrollY;const el=$('#estetica');const ne=document.createElement('div');ne.innerHTML=sAesth();el.replaceWith(ne.firstElementChild);scrollTo(0,y);return}
  if(d.lb){const[id,i]=d.lb.split(':');openLB(id,+i);return}
  if(d.dl){doDownload();return}
  if(d.vs){const[id,i]=d.vs.split(':');VI[id]=+i;mediaCol(id);return}
});
function buHover(e){const o=e.target.closest&&e.target.closest('[data-ord]');const t=e.target.closest&&e.target.closest('[data-bu],.tab[data-t]');const v=t?(t.dataset.bu||t.dataset.t):null;const ord=o?+o.dataset.ord:null;if((S.buH||null)!==v||(S.buO||null)!==ord){S.buH=v;S.buO=ord;refreshBU()}}
document.addEventListener('mouseover',buHover);document.addEventListener('focusin',buHover);
document.addEventListener('focusout',e=>{if(S.buH||S.buO){S.buH=null;S.buO=null;refreshBU()}});
function refreshSpider(){
  const list=S.spMode==='all'?PROJ:PROJ.filter(p=>p.tema===S.tab);
  $('#spider').innerHTML=spiderInner(list);
}
document.addEventListener('keydown',e=>{
  if(S.lb){if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')lbStep(1);if(e.key==='ArrowLeft')lbStep(-1);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-ax],[data-bb],[data-off]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
function spy(){
  if(window._spy)window._spy.disconnect();
  const ids=['projeto','dados','ensaios','estetica','achados','notas','sobre'];
  window._spy=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.sec===en.target.id))}}),{rootMargin:'-45% 0px -50% 0px'});
  ids.forEach(i=>{const el=document.getElementById(i);if(el)window._spy.observe(el)});
}
function init(){
  try{const sv=localStorage.getItem('p247lang');if(sv&&LANGS.includes(sv))lang=sv;else{const n=(navigator.language||'pt').slice(0,2);if(LANGS.includes(n))lang=n}}catch(_){ }
  $('#logo-img').src=img('logo');
  $('#lb .x').onclick=closeLB;$('#lb .pv').onclick=()=>lbStep(-1);$('#lb .nx').onclick=()=>lbStep(1);
  $('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB()});
  buildHero();render(false);
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
